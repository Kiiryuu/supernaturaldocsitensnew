<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supernatural - Arquivos dos Caçadores</title>
    <style>
        body {
            background-color: #0d0d0d;
            background-image: radial-gradient(#1a0505 1px, transparent 1px);
            background-size: 20px 20px;
            color: #d1c7bd;
            font-family: 'Georgia', serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px 0;
            box-sizing: border-box;
        }
        .login-box {
            background: #141414;
            padding: 35px 30px;
            border-radius: 4px;
            box-shadow: 0 0 20px rgba(139, 0, 0, 0.4), inset 0 0 10px rgba(0, 0, 0, 0.8);
            border: 1px solid #3d0c0c;
            text-align: center;
            width: 360px;
        }
        h2 {
            color: #8b0000;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-top: 0;
            font-size: 22px;
            text-shadow: 0 0 5px rgba(139, 0, 0, 0.6);
            border-bottom: 1px solid #3d0c0c;
            padding-bottom: 10px;
        }
        p.sub-title {
            font-size: 12px;
            color: #7a7a7a;
            margin-bottom: 20px;
            font-style: italic;
        }
        input {
            width: 90%;
            padding: 12px;
            margin: 10px 0;
            background: #0a0a0a;
            border: 1px solid #5a1a1a;
            color: #e0d0b0;
            border-radius: 2px;
            font-family: inherit;
            font-size: 15px;
            box-sizing: border-box;
        }
        input:focus {
            outline: none;
            border-color: #8b0000;
            box-shadow: 0 0 5px rgba(139, 0, 0, 0.8);
        }
        button.btn-acessar {
            width: 90%;
            padding: 12px;
            background: #5a0000;
            border: 1px solid #8b0000;
            color: #f0e6d2;
            font-family: inherit;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-radius: 2px;
            cursor: pointer;
            transition: all 0.3s;
        }
        button.btn-acessar:hover {
            background: #8b0000;
            color: #fff;
            box-shadow: 0 0 10px rgba(139, 0, 0, 0.8);
        }
        #erro {
            color: #ff4d4d;
            margin-top: 12px;
            font-size: 13px;
            font-weight: bold;
        }

            padding-top: 15px;
            text-align: left;
        }

            color: #a89f91;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
