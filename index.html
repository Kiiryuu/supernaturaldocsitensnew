<html lang="pt-BR">

    <title>Supernatural - Arquivos dos Caçadores</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            background-color: #0d0d0d;
            color: #d1c7bd;
            font-family: 'Georgia', serif;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .login-box {
            background: #141414;
            padding: 30px;
            border-radius: 6px;
            box-shadow: 0 0 25px rgba(139, 0, 0, 0.5);
            border: 2px solid #5a0000;
            text-align: center;
            width: 100%;
            max-width: 420px;
        }
        h2 {
            color: #b22222;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-top: 0;
            font-size: 22px;
            border-bottom: 1px solid #3d0c0c;
            padding-bottom: 12px;
        }
        p.sub-title {
            font-size: 13px;
            color: #8a8a8a;
            margin-bottom: 20px;
            font-style: italic;
        }
        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 12px;
            background: #000000;
            border: 1px solid #5a1a1a;
            color: #ffffff;
            border-radius: 4px;
            font-family: inherit;
            font-size: 15px;
        }
        input:focus {
            outline: none;
            border-color: #b22222;
            box-shadow: 0 0 8px rgba(178, 34, 34, 0.8);
        }
        button.btn-acessar {
            width: 100%;
            padding: 12px;
            background: #7a0000;
            border: 1px solid #b22222;
            color: #ffffff;
            font-family: inherit;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.2s;
        }
        button.btn-acessar:hover {
            background: #b22222;
        }
        #erro {
            color: #ff4d4d;
            margin-top: 12px;
            font-size: 14px;
            font-weight: bold;
        }
        .atalhos-container {
            margin-top: 25px;
            border-top: 1px dashed #5a1a1a;
            padding-top: 15px;
            text-align: left;
            max-height: 250px;
            overflow-y: auto;
        }
        .header-atalhos {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .header-atalhos h4 {
            margin: 0;
            font-size: 12px;
            color: #a89f91;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .btn-limpar {
            background: transparent;
            border: 1px solid #5a1a1a;
            color: #8a8a8a;
            font-size: 10px;
            text-transform: uppercase;
            padding: 4px 8px;
            border-radius: 3px;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
        }
        .btn-limpar:hover {
            background: #5a0000;
            color: #ffffff;
            border-color: #b22222;
        }
        .atalho-btn {
            display: block;
            width: 100%;
            padding: 10px;
            margin-bottom: 8px;
            background: #1c1816;
            border: 1px solid #4a3b32;
            color: #c9bda8;
            border-radius: 4px;
            cursor: pointer;
            text-align: left;
            font-family: inherit;
            font-size: 13px;
            transition: all 0.2s;
        }
        .atalho-btn:hover {
            background: #2a221e;
            color: #ffffff;
            border-color: #b22222;
        }
    </style>
</head>
