<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supernatural - Arquivos dos Caçadores</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            background-color: #0d0d0d;
            color: #d1c7bd;
            font-family: 'Georgia', serif;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .login-box {
            background: #141414;
            padding: 30px;
            border-radius: 6px;
            box-shadow: 0 0 25px rgba(139, 0, 0, 0.5);
            border: 2px solid #5a0000;
            text-align: center;
            width: 100%;
            max-width: 420px;
        }
        h2 {
            color: #b22222;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-top: 0;
            font-size: 22px;
            border-bottom: 1px solid #3d0c0c;
            padding-bottom: 12px;
        }
        p.sub-title {
            font-size: 13px;
            color: #8a8a8a;
            margin-bottom: 20px;
            font-style: italic;
        }
        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 12px;
            background: #000000;
            border: 1px solid #5a1a1a;
            color: #ffffff;
            border-radius: 4px;
            font-family: inherit;
            font-size: 15px;
        }
        input:focus {
            outline: none;
            border-color: #b22222;
            box-shadow: 0 0 8px rgba(178, 34, 34, 0.8);
        }
        button.btn-acessar {
            width: 100%;
            padding: 12px;
            background: #7a0000;
            border: 1px solid #b22222;
            color: #ffffff;
            font-family: inherit;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.2s;
        }
        button.btn-acessar:hover {
            background: #b22222;
        }
        #erro {
            color: #ff4d4d;
            margin-top: 12px;
            font-size: 14px;
            font-weight: bold;
        }
        .atalhos-container {
            margin-top: 25px;
            border-top: 1px dashed #5a1a1a;
            padding-top: 15px;
            text-align: left;
            max-height: 250px;
            overflow-y: auto;
        }
        .header-atalhos {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .header-atalhos h4 {
            margin: 0;
            font-size: 12px;
            color: #a89f91;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .btn-limpar {
            background: #3a0000;
            border: 1px solid #8b0000;
            color: #d1c7bd;
            font-size: 11px;
            text-transform: uppercase;
            padding: 4px 8px;
            border-radius: 3px;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
        }
        .btn-limpar:hover {
            background: #b22222;
            color: #ffffff;
        }
        .atalho-btn {
            display: block;
            width: 100%;
            padding: 10px;
            margin-bottom: 8px;
            background: #1c1816;
            border: 1px solid #4a3b32;
            color: #c9bda8;
            border-radius: 4px;
            cursor: pointer;
            text-align: left;
            font-family: inherit;
            font-size: 13px;
            transition: all 0.2s;
        }
        .atalho-btn:hover {
            background: #2a221e;
            color: #ffffff;
            border-color: #b22222;
        }
    </style>
</head>
<body>

    <div class="login-box">
        <h2>Supernatural</h2>
        <p class="sub-title">Insira a chave ou código da pista</p>

        <input type="text" id="senhaInput" placeholder="Digite a chave..." autofocus>
        <button class="btn-acessar" onclick="tentarAcessar()">Desencriptar</button>
        <div id="erro"></div>

        <div id="secaoAtalhos" class="atalhos-container" style="display: none;">
            <div class="header-atalhos">
                <h4>Registos Desbloqueados</h4>
                <button class="btn-limpar" onclick="limparHistorico()">Limpar Histórico</button>
            </div>
            <div id="listaAtalhos"></div>
        </div>
    </div>

    <script>
        const rotas = {
            "480": { arquivo: "480.pdf", nome: "Registro 480" },
            "a ultima batalha": { arquivo: "A ultima batalha.pdf", nome: "A Última Batalha" },
            "ultima batalha": { arquivo: "A ultima batalha.pdf", nome: "A Última Batalha" },
            "agnes": { arquivo: "AGNES.pdf", nome: "Documento: Agnes" },
            "agnes 2": { arquivo: "Agnes2.pdf", nome: "Documento: Agnes 2" },
            "agnes2": { arquivo: "Agnes2.pdf", nome: "Documento: Agnes 2" },
            "barganha": { arquivo: "BARGANHA.pdf", nome: "Documento: Barganha" },
            "citala": { arquivo: "Cítala.html", nome: "Cítala (HTML)" },
            "equilibrio": { arquivo: "EQUILIBRIO.pdf", nome: "Documento: Equilíbrio" },
            "excallibur": { arquivo: "Excallibur.pdf", nome: "Excallibur" },
            "excalibur": { arquivo: "Excallibur.pdf", nome: "Excallibur" },
            "leonidas": { arquivo: "Leonidas.pdf", nome: "Leonidas" },
            "o baralho do louco": { arquivo: "O Baralho do Louco.html", nome: "O Baralho do Louco" },
            "baralho do louco": { arquivo: "O Baralho do Louco.html", nome: "O Baralho do Louco" },
            "o livro dos condenados": { arquivo: "O livro dos condenados.pdf", nome: "O Livro dos Condenados" },
            "livro dos condenados": { arquivo: "O livro dos condenados.pdf", nome: "O Livro dos Condenados" },
            "po de fantasma": { arquivo: "Pó de Fantasma — Materiais.html", nome: "Pó de Fantasma - Materiais" },
            "materiais": { arquivo: "Pó de Fantasma — Materiais.html", nome: "Pó de Fantasma - Materiais" },
            "simonides": { arquivo: "Simónides.pdf", nome: "Simónides" },
            "tubo de ensaio": { arquivo: "Tubo de Ensaio (3D).html", nome: "Tubo de Ensaio (3D)" },
            "tubo": { arquivo: "Tubo de Ensaio (3D).html", nome: "Tubo de Ensaio (3D)" },
            "caixa": { arquivo: "caixa.html", nome: "Caixa de Baralho" },
            "maxmiliam": { arquivo: "maxmiliam.pdf", nome: "Documento: Maxmiliam" },
            "arthur": { arquivo: "maxmiliam.pdf", nome: "Documento: Maxmiliam" },
            "rafael": { arquivo: "maxmiliam.pdf", nome: "Documento: Maxmiliam" },
            "rafael dumas": { arquivo: "maxmiliam.pdf", nome: "Documento: Maxmiliam" },
            "arthur kravinsk": { arquivo: "maxmiliam.pdf", nome: "Documento: Maxmiliam" },
            "o rei de camelot": { arquivo: "o rei de camelot.pdf", nome: "O Rei de Camelot" },
            "rei de camelot": { arquivo: "o rei de camelot.pdf", nome: "O Rei de Camelot" },
            "molon labe": { arquivo: "μολὼν λαβέ.pdf", nome: "Molon Labe" },
            "molonlabe": { arquivo: "μολὼν λαβέ.pdf", nome: "Molon Labe" },
            "a verdade": { arquivo: "A verdade.pdf", nome: "Documento: A Verdade" },
            "verdade": { arquivo: "A verdade.pdf", nome: "Documento: A Verdade" },
            "lamina da dicotomia": { arquivo: "LAMINA DA DICOTOMIA.pdf", nome: "Lâmina da Dicotomia" },
            "lamina": { arquivo: "LAMINA DA DICOTOMIA.pdf", nome: "Lâmina da Dicotomia" },
            "lilith": { arquivo: "Lilith.pdf", nome: "Documento: Lilith" },
            "o selo": { arquivo: "selo.html", nome: "Documento: O Selo" },
            "selo": { arquivo: "selo.html", nome: "Documento: O Selo" },
            "quadros": { arquivo: "Quadros.html", nome: "Quadros" },
            "pad simbolos": { arquivo: "Pad_Simbolos.html", nome: "Pad Símbolos" },
            "pad_simbolos": { arquivo: "Pad_Simbolos.html", nome: "Pad Símbolos" },
            "simbolos": { arquivo: "Pad_Simbolos.html", nome: "Pad Símbolos" },
            "sala manual": { arquivo: "Sala_Manual.html", nome: "Sala Manual" },
            "sala_manual": { arquivo: "Sala_Manual.html", nome: "Sala Manual" },
            "manual": { arquivo: "Sala_Manual.html", nome: "Sala Manual" },
            "pedras": { arquivo: "Pedras.html", nome: "Pedras" },

            // Novos ficheiros adicionados
            "seven haven": { arquivo: "Seven Haven — Catálogo de Caçadores.html", nome: "Seven Haven — Catálogo de Caçadores" },
            "catalogo de cacadores": { arquivo: "Seven Haven — Catálogo de Caçadores.html", nome: "Seven Haven — Catálogo de Caçadores" },
            "seven haven catalogo de cacadores": { arquivo: "Seven Haven — Catálogo de Caçadores.html", nome: "Seven Haven — Catálogo de Caçadores" },
            "cacadores": { arquivo: "Seven Haven — Catálogo de Caçadores.html", nome: "Seven Haven — Catálogo de Caçadores" },
            "tetris arcade": { arquivo: "Tetris Arcade.html", nome: "Tetris Arcade" },
            "tetris": { arquivo: "Tetris Arcade.html", nome: "Tetris Arcade" }
        };

        function normalizarTexto(texto) {
            if (!texto) return "";
            return texto
                .toString()
                .toLowerCase()
                .normalize("NFD")
                .replace(/[\u0300-\u036f]/g, "")
                .replace(/[^a-z0-9\s]/g, "")
                .replace(/\s+/g, " ")
                .trim();
        }

        function carregarAtalhos() {
            try {
                const listaAtalhosDiv = document.getElementById("listaAtalhos");
                const secaoAtalhos = document.getElementById("secaoAtalhos");
                if (!listaAtalhosDiv || !secaoAtalhos) return;

                listaAtalhosDiv.innerHTML = "";
                let atalhosSalvos = JSON.parse(localStorage.getItem("spn_atalhos_v2")) || [];

                if (Array.isArray(atalhosSalvos) && atalhosSalvos.length > 0) {
                    secaoAtalhos.style.display = "block";
                    let exibidos = [];

                    atalhosSalvos.forEach(senhaKey => {
                        if (rotas[senhaKey]) {
                            const info = rotas[senhaKey];
                            if (!exibidos.includes(info.nome)) {
                                exibidos.push(info.nome);
                                const btn = document.createElement("button");
                                btn.className = "atalho-btn";
                                btn.textContent = `📜 ${info.nome}`;
                                btn.onclick = function() {
                                    window.location.href = info.arquivo;
                                };
                                listaAtalhosDiv.appendChild(btn);
                            }
                        }
                    });
                } else {
                    secaoAtalhos.style.display = "none";
                }
            } catch (e) {
                console.error("Erro ao carregar atalhos:", e);
            }
        }

        function tentarAcessar() {
            const input = document.getElementById("senhaInput");
            const erroDiv = document.getElementById("erro");
            
            if (!input) {
                alert("Erro: Campo de senha não encontrado!");
                return;
            }

            const senhaNormalizada = normalizarTexto(input.value);

            if (rotas[senhaNormalizada]) {
                erroDiv.textContent = "";
                try {
                    let atalhosSalvos = JSON.parse(localStorage.getItem("spn_atalhos_v2")) || [];
                    if (!Array.isArray(atalhosSalvos)) atalhosSalvos = [];
                    if (!atalhosSalvos.includes(senhaNormalizada)) {
                        atalhosSalvos.push(senhaNormalizada);
                        localStorage.setItem("spn_atalhos_v2", JSON.stringify(atalhosSalvos));
                    }
                } catch (e) {
                    console.error("Erro no localStorage:", e);
                }

                window.location.href = rotas[senhaNormalizada].arquivo;
            } else {
                erroDiv.textContent = "Chave desconhecida: '" + senhaNormalizada + "'";
            }
        }

        function limparHistorico() {
            if (confirm("Tem certeza que deseja apagar os registros desbloqueados?")) {
                localStorage.removeItem("spn_atalhos_v2");
                carregarAtalhos();
            }
        }

        document.getElementById("senhaInput").addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                tentarAcessar();
            }
        });

        window.onload = carregarAtalhos;
    </script>
</body>
</html>
