<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supernatural - Arquivos dos Caçadores</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            background-color: #0d0d0d;
            color: #d1c7bd;
            font-family: 'Georgia', serif;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .login-box {
            background: #141414;
            padding: 30px;
            border-radius: 6px;
            box-shadow: 0 0 25px rgba(139, 0, 0, 0.5);
            border: 2px solid #5a0000;
            text-align: center;
            width: 100%;
            max-width: 420px;
        }
        h2 {
            color: #b22222;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-top: 0;
            font-size: 22px;
            border-bottom: 1px solid #3d0c0c;
            padding-bottom: 12px;
        }
        p.sub-title {
            font-size: 13px;
            color: #8a8a8a;
            margin-bottom: 20px;
            font-style: italic;
        }
        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 12px;
            background: #000000;
            border: 1px solid #5a1a1a;
            color: #ffffff;
            border-radius: 4px;
            font-family: inherit;
            font-size: 15px;
        }
        input:focus {
            outline: none;
            border-color: #b22222;
            box-shadow: 0 0 8px rgba(178, 34, 34, 0.8);
        }
        button.btn-acessar {
            width: 100%;
            padding: 12px;
            background: #7a0000;
            border: 1px solid #b22222;
            color: #ffffff;
            font-family: inherit;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.2s;
        }
        button.btn-acessar:hover {
            background: #b22222;
        }
        #erro {
            color: #ff4d4d;
            margin-top: 12px;
            font-size: 14px;
            font-weight: bold;
        }
        .atalhos-container {
            margin-top: 25px;
            border-top: 1px dashed #5a1a1a;
            padding-top: 15px;
            text-align: left;
            max-height: 250px;
            overflow-y: auto;
        }
        .atalhos-container h4 {
            margin: 0 0 12px 0;
            font-size: 12px;
            color: #a89f91;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .atalho-btn {
            display: block;
            width: 100%;
            padding: 10px;
            margin-bottom: 8px;
            background: #1c1816;
            border: 1px solid #4a3b32;
            color: #c9bda8;
            border-radius: 4px;
            cursor: pointer;
            text-align: left;
            font-family: inherit;
            font-size: 13px;
            transition: all 0.2s;
        }
        .atalho-btn:hover {
            background: #2a221e;
            color: #ffffff;
            border-color: #b22222;
        }
    </style>
</head>
<body>

    <div class="login-box">
        <h2>Supernatural</h2>
        <p class="sub-title">Insira a chave ou código da pista</p>

        <input type="text" id="senhaInput" placeholder="Digite a chave..." autofocus>
        <button class="btn-acessar" onclick="tentarAcessar()">Desencriptar</button>
        <div id="erro"></div>

        <div id="secaoAtalhos" class="atalhos-container" style="display: none;">
            <h4>Registos Desbloqueados</h4>
            <div id="listaAtalhos"></div>
        </div>
    </div>

    <script>
        const rotas = {
            "agnes": { arquivo: "AGNES.pdf", nome: "Documento: Agnes" },
            "barganha": { arquivo: "BARGANHA.pdf", nome: "Documento: Barganha" },
            "o livro dos condenados": { arquivo: "O livro dos condenados.pdf", nome: "O Livro dos Condenados" },
            "livro dos condenados": { arquivo: "O livro dos condenados.pdf", nome: "O Livro dos Condenados" },
            "equilibrio": { arquivo: "EQUILIBRIO.pdf", nome: "Documento: Equilíbrio" },
            "hungaro": { arquivo: "HUNGARO.pdf", nome: "Documento: Húngaro" },
            "malachim": { arquivo: "MALACHIM.pdf", nome: "Documento: Malachim" },
            "nefilim": { arquivo: "NEFILIM.pdf", nome: "Documento: Nefilim" },
            "o caminho da dicotomia": { arquivo: "O CAMINHO DA DICOTOMIA.pdf", nome: "O Caminho da Dicotomia" },
            "caminho da dicotomia": { arquivo: "O CAMINHO DA DICOTOMIA.pdf", nome: "O Caminho da Dicotomia" },
            "maxmiliam": { arquivo: "maxmiliam.pdf", nome: "Documento: Maxmiliam" },
            "o baralho do louco": { arquivo: "O Baralho do Louco.html", nome: "O Baralho do Louco (HTML)" },
            "baralho do louco": { arquivo: "O Baralho do Louco.html", nome: "O Baralho do Louco (HTML)" },
            "caixa": { arquivo: "baralho.html", nome: "Baralho (HTML)" } // Senha alterada para "caixa"
        };

        function normalizarTexto(texto) {
            return texto
                .toLowerCase()
                .normalize("NFD")
                .replace(/[\u0300-\u036f]/g, "")
                .replace(/[.,\/#!$%\^&\*;:{}=\-_`~()?"']/g, "")
                .replace(/\s+/g, " ")
                .trim();
        }

        function carregarAtalhos() {
            const listaAtalhosDiv = document.getElementById("listaAtalhos");
            const secaoAtalhos = document.getElementById("secaoAtalhos");
            listaAtalhosDiv.innerHTML = "";

            let atalhosSalvos = JSON.parse(localStorage.getItem("spn_atalhos_desbloqueados")) || [];

            if (atalhosSalvos.length > 0) {
                secaoAtalhos.style.display = "block";
                
                let exibidos = [];

                atalhosSalvos.forEach(senhaKey => {
                    if (rotas[senhaKey]) {
                        const info = rotas[senhaKey];
                        if (!exibidos.includes(info.nome)) {
                            exibidos.push(info.nome);
                            const btn = document.createElement("button");
                            btn.className = "atalho-btn";
                            btn.textContent = `📜 ${info.nome}`;
                            btn.onclick = function() {
                                window.location.href = info.arquivo;
                            };
                            listaAtalhosDiv.appendChild(btn);
                        }
                    }
                });
            } else {
                secaoAtalhos.style.display = "none";
            }
        }

        function tentarAcessar() {
            const inputVal = document.getElementById("senhaInput").value;
            const senhaNormalizada = normalizarTexto(inputVal);
            const erroDiv = document.getElementById("erro");

            if (rotas[senhaNormalizada]) {
                let atalhosSalvos = JSON.parse(localStorage.getItem("spn_atalhos_desbloqueados")) || [];
                if (!atalhosSalvos.includes(senhaNormalizada)) {
                    atalhosSalvos.push(senhaNormalizada);
                    localStorage.setItem("spn_atalhos_desbloqueados", JSON.stringify(atalhosSalvos));
                }

                window.location.href = rotas[senhaNormalizada].arquivo;
            } else {
                erroDiv.textContent = "Chave incorreta ou desconhecida!";
            }
        }

        document.getElementById("senhaInput").addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                tentarAcessar();
            }
        });

        window.onload = carregarAtalhos;
    </script>
</body>
</html>
