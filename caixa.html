$('bF').onclick=()=>{goal=new THREE.Vector3(0,0,31);ctl.autoRotate=false;$('bR').textContent='Giro automático: desligado'};
$('bB').onclick=()=>{goal=new THREE.Vector3(0,0,-31);ctl.autoRotate=false;$('bR').textContent='Giro automático: desligado'};
$('bO').onclick=()=>{open=!open;$('bO').textContent=open?'Fechar tampa':'Abrir tampa'};
$('bR').onclick=()=>{ctl.autoRotate=!ctl.autoRotate;goal=null;$('bR').textContent='Giro automático: '+(ctl.autoRotate?'ligado':'desligado')};
function size(){const w=innerWidth,h=innerHeight;R.setSize(w,h);cam.aspect=w/h;cam.position.multiplyScalar(1);cam.updateProjectionMatrix()}
addEventListener('resize',size);size();
box.rotation.set(0,0,0);
(function loop(t){requestAnimationFrame(loop);
 box.position.y=Math.sin(t/900)*.25;
 lid.position.y+=((open?lidY+7.5:lidY)-lid.position.y)*.08;lid.rotation.z+=((open?-.35:0)-lid.rotation.z)*.08;
 if(goal)cam.position.lerp(goal,.06);ctl.update();R.render(S,cam)})(0);
</script></body></html>
