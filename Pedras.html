<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Puzzle das Pedras</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#0e0c0a;--fg:#eadfc8}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:Georgia,'Times New Roman',serif;overflow:hidden}
canvas{display:block;width:100%;height:100%;touch-action:none}
#hud{position:fixed;left:0;right:0;top:env(safe-area-inset-top,0px);padding:12px;text-align:center;font-size:14px;pointer-events:none;text-shadow:0 1px 4px #000}
#msg{position:fixed;left:0;right:0;bottom:calc(60px + env(safe-area-inset-bottom,0px));text-align:center;font-size:22px;opacity:0;transition:opacity 1s;text-shadow:0 2px 8px #000;pointer-events:none}
button{position:fixed;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));background:#2a2622;color:var(--fg);border:1px solid #8a7e6c;border-radius:8px;padding:8px 14px;font:inherit;cursor:pointer}
</style></head><body>
<div id="hud">Clique numa placa para retirá-la e clique em outro encaixe para colocá-la.</div>
<div id="msg"></div>
<button id="reset">Embaralhar de novo</button>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
// ---------- Áudio (pedra) ----------
let AC=null;
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}return AC;}
function noiseBuf(d){const c=ac(),b=c.createBuffer(1,Math.ceil(c.sampleRate*d),c.sampleRate),a=b.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=Math.random()*2-1;return b;}
function tone(type,f1,f2,dur,vol,delay){const c=ac();if(!c)return;const t=c.currentTime+(delay||0),o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.setValueAtTime(f1,t);o.frequency.exponentialRampToValueAtTime(f2,t+dur);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);o.connect(g).connect(c.destination);o.start(t);o.stop(t+dur+0.02);}
function grit(f,dur,vol,delay,q,rise){const c=ac();if(!c)return;const t=c.currentTime+(delay||0),s=c.createBufferSource(),fl=c.createBiquadFilter(),g=c.createGain();s.buffer=noiseBuf(dur+0.05);fl.type='bandpass';fl.frequency.value=f;fl.Q.value=q||1;
 g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(vol,t+(rise||0.005));g.gain.exponentialRampToValueAtTime(0.0001,t+dur);s.connect(fl).connect(g).connect(c.destination);s.start(t);}
function impact(f,vol,delay){[[1,1],[1.58,0.7],[2.13,0.5],[2.9,0.3]].forEach((p,i)=>tone('sine',f*p[0],f*p[0]*0.9,0.09+0.14/(i+1),vol*p[1],delay));grit(1100,0.05,vol*0.8,delay,1.5);tone('sine',f*0.4,25,0.25,vol*0.8,delay);}
function sndOut(){grit(1200,0.14,0.28,0,4,0.05);thock(190,0.35,0.1);thock(330,0.2,0.1);tone('sine',90,60,0.2,0.25,0.1);}
function reverb(c,sec){const n=Math.ceil(c.sampleRate*sec),b=c.createBuffer(2,n,c.sampleRate);for(let ch=0;ch<2;ch++){const d=b.getChannelData(ch);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,2.5);}const cv=c.createConvolver();cv.buffer=b;return cv;}
function sndFar(dur){const c=ac();if(!c)return;const t=c.currentTime;
 const bus=c.createGain(),lp=c.createBiquadFilter();lp.type='lowpass';lp.frequency.value=800;bus.connect(lp);
 const dry=c.createGain();dry.gain.value=0.1;lp.connect(dry).connect(c.destination);
 const rv=reverb(c,4.5),wet=c.createGain();wet.gain.value=1.3;lp.connect(rv).connect(wet).connect(c.destination);
 const dl=c.createDelay(1),fb=c.createGain(),dlp=c.createBiquadFilter(),eo=c.createGain();dl.delayTime.value=0.45;fb.gain.value=0.55;dlp.type='lowpass';dlp.frequency.value=550;eo.gain.value=0.5;
 lp.connect(dl);dl.connect(dlp);dlp.connect(fb).connect(dl);dlp.connect(eo).connect(c.destination);
 const env=c.createGain();env.gain.setValueAtTime(0.0001,t);env.gain.linearRampToValueAtTime(0.55,t+0.8);env.gain.setValueAtTime(0.55,t+dur-0.8);env.gain.linearRampToValueAtTime(0.0001,t+dur);env.connect(bus);
 const jud=c.createGain();jud.gain.value=0.3;for(let k=0;k<dur;k+=0.09)jud.gain.linearRampToValueAtTime(0.15+Math.random()*0.7,t+k);jud.connect(env);
 const s=c.createBufferSource();s.buffer=noiseBuf(dur);const bp=c.createBiquadFilter();bp.type='bandpass';bp.Q.value=4;bp.frequency.setValueAtTime(170,t);bp.frequency.linearRampToValueAtTime(360,t+dur*0.5);bp.frequency.linearRampToValueAtTime(210,t+dur);s.connect(bp).connect(jud);s.start(t);
 [[138,0.1],[207,0.07],[331,0.04]].forEach(p=>{const o=c.createOscillator(),g=c.createGain();o.type='triangle';o.frequency.setValueAtTime(p[0],t);o.frequency.linearRampToValueAtTime(p[0]*1.06,t+dur);g.gain.value=p[1];o.connect(g).connect(jud);o.start(t);o.stop(t+dur);});
 const r=c.createOscillator(),rg=c.createGain(),rl=c.createBiquadFilter();r.type='sawtooth';r.frequency.value=44;rl.type='lowpass';rl.frequency.value=140;rg.gain.value=0.35;r.connect(rl).connect(rg).connect(env);r.start(t);r.stop(t+dur);
 const e=c.createOscillator(),eg=c.createGain();e.type='sine';e.frequency.setValueAtTime(95,t+dur);e.frequency.exponentialRampToValueAtTime(30,t+dur+0.7);eg.gain.setValueAtTime(0.0001,t);eg.gain.setValueAtTime(0.9,t+dur);eg.gain.exponentialRampToValueAtTime(0.0001,t+dur+0.7);e.connect(eg).connect(bus);e.start(t);e.stop(t+dur+0.8);}
function thock(f,v,d){grit(f,0.4,v*5,d,25,0.002);}
function sndIn(){grit(2500,0.03,0.3,0,1,0.002);thock(150,0.9,0.01);thock(260,0.55,0.01);thock(430,0.3,0.01);tone('sine',75,38,0.45,0.75,0.01);thock(150,0.3,0.14);}
function sndSink(v){tone('sine',62,26,1.1,0.85*v);grit(300,0.9,0.55*v,0,1.5,0.2);thock(110,0.9*v,0.02);thock(200,0.5*v,0.02);}
function sndHum(){tone('sine',55,52,3.5,0.0001);const c=ac();if(!c)return;const t=c.currentTime;
 [55,82.5,110].forEach((f,i)=>{const o=c.createOscillator(),g=c.createGain();o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(0.14/(i+1),t+1.2);g.gain.linearRampToValueAtTime(0.0001,t+4);o.connect(g).connect(c.destination);o.start(t);o.stop(t+4.1);});}
function sndScrape(dur){const c=ac();if(!c)return;const t=c.currentTime;
 const out=c.createGain();out.gain.value=0.45;const lp=c.createBiquadFilter();lp.type='lowpass';lp.frequency.value=700; // som distante, vindo do fundo
 out.connect(lp).connect(c.destination);
 const s=c.createBufferSource();s.buffer=noiseBuf(dur);const bp=c.createBiquadFilter();bp.type='bandpass';bp.Q.value=1.6;bp.frequency.setValueAtTime(230,t);bp.frequency.linearRampToValueAtTime(480,t+dur*0.6);bp.frequency.linearRampToValueAtTime(280,t+dur);
 const g=c.createGain();g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(0.6,t+0.5);g.gain.setValueAtTime(0.6,t+dur-0.6);g.gain.linearRampToValueAtTime(0.0001,t+dur);
 const lfo=c.createOscillator(),lg=c.createGain();lfo.frequency.value=8;lg.gain.value=0.3;lfo.connect(lg).connect(g.gain);
 s.connect(bp).connect(g).connect(out);
 const o=c.createOscillator(),og=c.createGain();o.type='sawtooth';o.frequency.value=46;og.gain.setValueAtTime(0.0001,t);og.gain.linearRampToValueAtTime(0.25,t+0.6);og.gain.linearRampToValueAtTime(0.0001,t+dur);o.connect(og).connect(out);
 s.start(t);lfo.start(t);o.start(t);o.stop(t+dur);lfo.stop(t+dur);
 tone('sine',90,30,0.6,0.5,dur); // ferro encostando no fim
}

// ---------- Texturas de pedra ----------
function noiseCanvas(s,base,amp){
 const c=document.createElement('canvas');c.width=c.height=s;const x=c.getContext('2d');
 const d=x.createImageData(s,s);
 for(let i=0;i<s*s;i++){const n=(Math.random()-0.5)*amp;d.data[i*4]=base[0]+n;d.data[i*4+1]=base[1]+n;d.data[i*4+2]=base[2]+n;d.data[i*4+3]=255;}
 x.putImageData(d,0,0);
 for(let i=0;i<50;i++){x.fillStyle=Math.random()<0.5?'rgba(0,0,0,0.06)':'rgba(255,255,255,0.05)';x.beginPath();x.arc(Math.random()*s,Math.random()*s,s*0.02+Math.random()*s*0.09,0,7);x.fill();}
 return c;
}
function drawSym(x,id){
 x.lineWidth=8;x.beginPath();
 if(id===0){
  x.rect(110,82,110,26);x.stroke();x.beginPath();
  x.moveTo(110,82);x.lineTo(70,82);x.lineTo(62,140);x.lineTo(125,140);x.stroke();
  x.beginPath();x.arc(105,111,24,0,7);x.stroke();
  x.beginPath();x.moveTo(72,140);x.lineTo(52,208);x.lineTo(96,212);x.lineTo(120,142);x.stroke();
  x.beginPath();x.arc(135,152,16,0,Math.PI);x.stroke();
  x.beginPath();x.moveTo(62,82);x.lineTo(55,66);x.stroke();
 }else if(id===1){
  x.ellipse(128,108,60,54,0,0,7);x.stroke();
  x.beginPath();x.moveTo(98,150);x.lineTo(98,196);x.lineTo(158,196);x.lineTo(158,150);x.stroke();
  x.beginPath();x.arc(104,112,14,0,7);x.arc(152,112,14,0,7);x.fill();
  x.beginPath();x.moveTo(128,128);x.lineTo(119,148);x.lineTo(137,148);x.closePath();x.fill();
  x.beginPath();x.moveTo(118,196);x.lineTo(118,172);x.moveTo(138,196);x.lineTo(138,172);x.lineWidth=5;x.stroke();
 }else if(id===2){
  x.moveTo(128,38);x.bezierCurveTo(150,80,200,100,192,160);x.bezierCurveTo(186,208,150,224,128,224);
  x.bezierCurveTo(96,224,62,200,66,152);x.bezierCurveTo(68,120,92,108,98,76);x.bezierCurveTo(112,92,118,70,128,38);x.stroke();
  x.beginPath();x.moveTo(130,120);x.bezierCurveTo(146,148,166,160,160,188);x.bezierCurveTo(156,206,140,210,128,210);
  x.bezierCurveTo(108,210,96,196,100,176);x.bezierCurveTo(104,154,122,150,130,120);x.stroke();
 }else if(id===3){
  x.arc(128,70,38,Math.PI,0);x.stroke();
  x.beginPath();x.rect(88,72,80,12);x.stroke();
  x.beginPath();x.moveTo(92,84);x.lineTo(80,196);x.quadraticCurveTo(128,214,176,196);x.lineTo(164,84);x.stroke();
  x.beginPath();[[110,52],[128,46],[146,52],[128,62]].forEach(p=>{x.moveTo(p[0]+4,p[1]);x.arc(p[0],p[1],4,0,7);});x.fill();
  x.beginPath();[[104,128],[128,120],[152,130],[116,158],[142,162],[128,142]].forEach(p=>{x.rect(p[0]-5,p[1]-5,10,10);});x.lineWidth=4;x.stroke();
 }else{
  x.translate(128,128);x.rotate(-Math.PI/4);
  x.moveTo(-105,10);x.quadraticCurveTo(-40,-26,18,-16);x.lineTo(18,14);x.closePath();x.stroke();
  x.beginPath();x.rect(18,-32,14,64);x.stroke();
  x.beginPath();x.rect(32,-13,70,26);x.stroke();
  x.beginPath();x.moveTo(-70,2);x.lineTo(10,0);x.lineWidth=4;x.stroke();
 }
}
function carve(x,id,color,dx,dy){x.save();x.translate(dx,dy);x.strokeStyle=x.fillStyle=color;x.lineCap='round';x.lineJoin='round';drawSym(x,id);x.restore();}
function symMaps(id){
 const col=noiseCanvas(256,[138,131,121],40),cx=col.getContext('2d');
 carve(cx,id,'rgba(255,255,255,0.3)',3,3);carve(cx,id,'rgba(0,0,0,0.6)',-2,-2);carve(cx,id,'#2c2722',0,0);
 const bump=document.createElement('canvas');bump.width=bump.height=256;const bx=bump.getContext('2d');bx.fillStyle='#c8c8c8';bx.fillRect(0,0,256,256);carve(bx,id,'#000',0,0);
 const em=document.createElement('canvas');em.width=em.height=256;const ex=em.getContext('2d');ex.fillStyle='#000';ex.fillRect(0,0,256,256);carve(ex,id,'#ffc15a',0,0);
 return {map:new THREE.CanvasTexture(col),bump:new THREE.CanvasTexture(bump),em:new THREE.CanvasTexture(em)};
}
function wallCanvas(){
 const s=512,c=document.createElement('canvas');c.width=c.height=s;const x=c.getContext('2d');
 const rows=8,h=s/rows;
 for(let r=0;r<rows;r++){const w=128,off=(r%2)*64;for(let b=-1;b<5;b++){const v=88+Math.random()*34|0;x.fillStyle='rgb('+v+','+(v-4)+','+(v-10)+')';x.fillRect(b*w+off,r*h,w,h);}}
 const d=x.getImageData(0,0,s,s);for(let i=0;i<s*s;i++){const n=(Math.random()-0.5)*28;d.data[i*4]+=n;d.data[i*4+1]+=n;d.data[i*4+2]+=n;}x.putImageData(d,0,0);
 x.strokeStyle='#241f1b';x.lineWidth=5;
 for(let r=0;r<=rows;r++){x.beginPath();x.moveTo(0,r*h);x.lineTo(s,r*h);x.stroke();}
 for(let r=0;r<rows;r++){const off=(r%2)*64;for(let b=-1;b<5;b++){x.beginPath();x.moveTo(b*128+off,r*h);x.lineTo(b*128+off,(r+1)*h);x.stroke();}}
 return c;
}
function haloTex(){const c=document.createElement('canvas');c.width=c.height=128;const x=c.getContext('2d');const g=x.createRadialGradient(64,64,4,64,64,64);g.addColorStop(0,'rgba(255,200,100,1)');g.addColorStop(0.45,'rgba(255,160,60,0.45)');g.addColorStop(1,'rgba(255,140,40,0)');x.fillStyle=g;x.fillRect(0,0,128,128);return new THREE.CanvasTexture(c);}

// ---------- Cena ----------
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
document.body.appendChild(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color(0x040302);scene.fog=new THREE.Fog(0x040302,6,15);
const cam=new THREE.PerspectiveCamera(48,1,0.1,50);
const camBase=new THREE.Vector3(0,0,8.6);
scene.add(new THREE.AmbientLight(0xffe4c8,0.14));
const torch=new THREE.PointLight(0xff9a50,0.95,12);torch.position.set(0,2.5,4);scene.add(torch);
const fill=new THREE.DirectionalLight(0xbcd0ff,0.04);fill.position.set(-4,3,5);scene.add(fill);
const gold=new THREE.PointLight(0xffb050,0,7);gold.position.set(0,0,1.6);scene.add(gold);

const stoneMat=(rgb,amp,rep)=>{const t=new THREE.CanvasTexture(noiseCanvas(128,rgb,amp));return new THREE.MeshStandardMaterial({map:t,roughness:0.95});};
function box(w,h,d,mat,x,y,z){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);m.position.set(x,y,z);scene.add(m);return m;}
const wt=new THREE.CanvasTexture(wallCanvas());wt.wrapS=wt.wrapT=THREE.RepeatWrapping;wt.repeat.set(3,2);
const wall=new THREE.Mesh(new THREE.PlaneGeometry(22,12),new THREE.MeshStandardMaterial({map:wt,bumpMap:wt,bumpScale:1.5,roughness:1,color:0x8a8a8a}));wall.position.set(0,1.2,0);scene.add(wall);
const floor=new THREE.Mesh(new THREE.PlaneGeometry(22,16),stoneMat([70,64,58],30));floor.rotation.x=-Math.PI/2;floor.position.set(0,-3.4,7);scene.add(floor);
[-4.2,4.2].forEach(x=>{box(0.9,10,0.7,stoneMat([112,105,96],40),x,1.6,0.35);box(1.3,0.5,1.0,stoneMat([100,94,86],40),x,-3.1,0.5);});

// painel de pedra com encaixes
const SX=0,SY=[2.2,1.1,0,-1.1,-2.2];
box(1.6,6.5,0.1,stoneMat([96,90,82],40),SX,0,0.05);
const slotMeshes=[];
SY.forEach((y,i)=>{const s=box(1.1,1.1,0.06,new THREE.MeshStandardMaterial({color:0x1a1714,roughness:1}),SX,y,0.11);s.userData.slot=i;slotMeshes.push(s);});

// halos (brilho final)
const hTex=haloTex(),halos=[];
SY.forEach(y=>{const h=new THREE.Mesh(new THREE.PlaneGeometry(2.4,2.4),new THREE.MeshBasicMaterial({map:hTex,transparent:true,opacity:0,blending:THREE.AdditiveBlending,depthWrite:false}));h.position.set(SX,y,0.3);scene.add(h);halos.push(h);});

// placas de pedra
const plates=[],faceMats=[],bodyMat=stoneMat([118,111,101],45);
for(let id=0;id<5;id++){
 const g=new THREE.Group(),m=symMaps(id);
 const bm=bodyMat.clone();bm.emissive=new THREE.Color(0x603010);bm.emissiveIntensity=0;
 const body=new THREE.Mesh(new THREE.BoxGeometry(1.0,1.0,0.18),bm);
 const fm=new THREE.MeshStandardMaterial({map:m.map,bumpMap:m.bump,bumpScale:3,roughness:0.95,emissive:0xffffff,emissiveMap:m.em,emissiveIntensity:0});
 const face=new THREE.Mesh(new THREE.PlaneGeometry(0.82,0.82),fm);face.position.z=0.091;
 g.add(body,face);g.userData.id=id;scene.add(g);plates.push(g);faceMats.push(fm);body.userData.plate=g;g.userData.bm=bm;
}

// ---------- Estado ----------
let slots=[null,null,null,null,null],held=null,solved=false;
const raycaster=new THREE.Raycaster(),mouse=new THREE.Vector2(0,0);
const holdPlane=new THREE.Plane(new THREE.Vector3(0,0,1),-1.0);
const holdPos=new THREE.Vector3(SX,0,1);
function shuffle(){
 let p;do{p=[0,1,2,3,4];for(let i=4;i>0;i--){const j=Math.random()*(i+1)|0;[p[i],p[j]]=[p[j],p[i]];}}while(p.some((v,i)=>v===i));
 slots=p;held=null;
}
const slotOf=id=>slots.indexOf(id);
function targetFor(id){
 if(held===id)return {x:holdPos.x,y:holdPos.y,z:1.0,s:1.15};
 const i=slotOf(id);return {x:SX,y:SY[i],z:sinkZ,s:1};
}
function check(){if(!solved&&held===null&&slots.every((v,i)=>v===i))solve();}

function pick(e){
 const r=renderer.domElement.getBoundingClientRect();
 mouse.set(((e.clientX-r.left)/r.width)*2-1,-((e.clientY-r.top)/r.height)*2+1);
 raycaster.setFromCamera(mouse,cam);
}
function onMove(e){pick(e);const p=new THREE.Vector3();if(raycaster.ray.intersectPlane(holdPlane,p))holdPos.set(p.x,p.y,1.0);}
function onDown(e){
 ac();if(AC&&AC.state==='suspended')AC.resume();
 if(solved)return;
 onMove(e);
 // a placa na mão fica fora do raycast, senão ela bloqueia o clique no encaixe
 const objs=[];plates.forEach((g,id)=>{if(id!==held)objs.push(g.children[0]);});slotMeshes.forEach(s=>objs.push(s));
 const hit=raycaster.intersectObjects(objs,false)[0];
 if(!hit)return;
 let target=null,plateId=null;
 if(hit.object.userData.slot!==undefined)target=hit.object.userData.slot;
 else{plateId=hit.object.userData.plate.userData.id;target=slotOf(plateId);}
 if(held===null){
  if(plateId===null)return;
  held=plateId;slots[target]=null;sndOut();
 }else if(slots[target]===null){
  slots[target]=held;held=null;sndIn();check();
 }else{
  const o=slots[target];slots[target]=held;held=o;sndIn();setTimeout(sndOut,130);
 }
}
renderer.domElement.addEventListener('pointermove',onMove);
renderer.domElement.addEventListener('pointerdown',onDown);
const rb=document.getElementById('reset');
rb.addEventListener('click',()=>{if(solved)return;shuffle();sndOut();});

// ---------- Final ----------
let T0=0,glowK=0,stage=0,sinkZ=0.2,sA=0,sB=0;
const msg=document.getElementById('msg');
function say(t){msg.textContent=t;msg.style.opacity=1;}
function solve(){
 solved=true;T0=performance.now();rb.style.display='none';
 document.getElementById('hud').style.opacity=0;
 sndHum();
}
function updateEnd(now){
 if(!solved)return 0;
 const t=(now-T0)/1000;
 glowK=Math.min(t/1.6,1);
 const E=k=>k*k*(3-2*k);
 if(!sA&&t>0.5){sA=1;sndSink(0.7);say('As placas afundam na pedra…');}
 if(!sB&&t>1.9){sB=1;sndSink(1.0);}
 if(t>1.5)slotMeshes.forEach(s=>s.visible=false);
 sinkZ=t<0.5?0.2:t<1.5?0.2-0.1*E(t-0.5):t<1.9?0.1:0.1-0.07*E(Math.min((t-1.9)/1.4,1));
 if(stage===0&&t>4){stage=1;sndFar(4.2);say('Ao longe, uma barra de ferro é arrastada…');}
 if(stage===1&&t>9){stage=2;say('O caminho está aberto.');}
 return ((t>0.5&&t<3.4)?0.008:0)+((t>4&&t<8.2)?0.004:0);
}

// ---------- Loop ----------
function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h);cam.aspect=w/h;cam.updateProjectionMatrix();}
addEventListener('resize',resize);resize();
shuffle();plates.forEach((g,id)=>{const t=targetFor(id);g.position.set(t.x,t.y,t.z);});
const tmp=new THREE.Vector3();
function loop(now){
 requestAnimationFrame(loop);
 const sh=updateEnd(now);
 plates.forEach((g,id)=>{const t=targetFor(id);tmp.set(t.x,t.y,t.z);g.position.lerp(tmp,0.3);const s=g.scale.x+(t.s-g.scale.x)*0.25;g.scale.setScalar(s);
  g.rotation.z=held===id?Math.sin(now/220)*0.04:0;
  const pulse=0.85+Math.sin(now/300+id)*0.15;
  faceMats[id].emissiveIntensity=glowK*1.7*pulse;g.userData.bm.emissiveIntensity=glowK*0.35;});
 halos.forEach((h,i)=>{h.material.opacity=glowK*(0.75+Math.sin(now/300+i)*0.2);});
 gold.intensity=glowK*(2.6+Math.sin(now/250)*0.3);
 cam.position.set(mouse.x*0.5+(Math.random()-0.5)*sh,mouse.y*0.3+(Math.random()-0.5)*sh,camBase.z);
 cam.lookAt(0,-0.1,0);
 torch.intensity=0.9+Math.sin(now/130)*0.1+Math.sin(now/57)*0.06;
 renderer.render(scene,cam);
}
requestAnimationFrame(loop);
})();
</script>
