<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Enigma da Cítala</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#e9dfca;--fg:#2b2118;--card:#fffaf0;--line:#c9b790;--accent:#8a2a1c;--ok:#2d6a3a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b150f;--fg:#f0e6d2;--card:#241c14;--line:#4a3c2a;--accent:#d9a441;--ok:#7fcf8f}}
:root[data-theme="dark"]{--bg:#1b150f;--fg:#f0e6d2;--card:#241c14;--line:#4a3c2a;--accent:#d9a441;--ok:#7fcf8f}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:Georgia,'Times New Roman',serif;display:flex;flex-direction:column}
#stage{flex:1;min-height:200px;position:relative;touch-action:none;cursor:grab}
#stage:active{cursor:grabbing}
canvas{display:block;width:100%;height:100%}
.panel{background:var(--card);border-top:1px solid var(--line);padding:12px 16px;display:grid;gap:10px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center}
input[type=range]{width:min(260px,60vw);accent-color:var(--accent)}
#kval{display:inline-block;min-width:1.6em;text-align:center;font-weight:bold;font-size:1.1rem;color:var(--accent)}
button,input[type=text]{font:inherit;font-size:.9rem;padding:8px 14px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--fg)}
button{cursor:pointer}
button.primary{background:var(--accent);color:var(--card);border-color:var(--accent);font-weight:bold}
input[type=text]{text-transform:uppercase;width:min(240px,55vw)}
#msg{min-height:1.2em;text-align:center;font-size:.95rem}
#msg:empty{display:none}
#msg.ok{color:var(--ok);font-weight:bold}
</style>
</head>
<body>
<div id="stage"></div>
<div class="panel">
  <div class="row">
    <input type="range" id="k" min="2" max="12" value="7" aria-label="Diâmetro do cabo">
    <span id="kval">7</span>
    <button id="unroll">Desenrolar</button>
  </div>
  <div class="row">
    <input type="text" id="ans" placeholder="Mensagem" autocomplete="off">
    <button class="primary" id="go">Decifrar</button>
  </div>
  <div id="msg"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const PLAIN="QXZTVKMOLONLABEZXQVTKRHW",KC=4,L0=PLAIN.length;
const CIPHER=[...Array(L0).keys()].map(i=>PLAIN[(i%KC)*(L0/KC)+Math.floor(i/KC)]).join('');
const N=CIPHER.length,W=.8;
const stage=document.getElementById('stage');
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
renderer.outputEncoding=THREE.sRGBEncoding;
stage.appendChild(renderer.domElement);
const aniso=renderer.capabilities.getMaxAnisotropy();
const scene=new THREE.Scene();
const cam=new THREE.PerspectiveCamera(38,1,.1,100);
scene.add(new THREE.HemisphereLight(0xfff0d8,0x3a2a1a,.9));
const key=new THREE.DirectionalLight(0xffe8c8,1.0);key.position.set(4,6,7);scene.add(key);
const rim=new THREE.DirectionalLight(0xaec4ff,.4);rim.position.set(-6,2,-5);scene.add(rim);
const yaw=new THREE.Group(),spinG=new THREE.Group();scene.add(yaw);yaw.add(spinG);

function rnd(a,b){return a+Math.random()*(b-a);}
function mkTex(cv){const t=new THREE.CanvasTexture(cv);t.encoding=THREE.sRGBEncoding;t.anisotropy=aniso;return t;}

function leatherCanvas(){
  const cw=96,ch=96*N,cv=document.createElement('canvas');cv.width=cw;cv.height=ch;
  const g=cv.getContext('2d');
  g.fillStyle='#c4965c';g.fillRect(0,0,cw,ch);
  for(let i=0;i<N*60;i++){g.fillStyle=Math.random()<.5?'rgba(70,40,15,'+rnd(.04,.12)+')':'rgba(255,225,170,'+rnd(.04,.1)+')';
    const s=rnd(1,5);g.fillRect(rnd(0,cw),rnd(0,ch),s,s*rnd(.5,2));}
  for(let i=0;i<N*4;i++){g.fillStyle='rgba(90,55,25,'+rnd(.05,.12)+')';g.beginPath();g.ellipse(rnd(0,cw),rnd(0,ch),rnd(8,30),rnd(8,24),0,0,7);g.fill();}
  const eg=g.createLinearGradient(0,0,cw,0);
  eg.addColorStop(0,'rgba(50,28,10,.55)');eg.addColorStop(.1,'rgba(50,28,10,0)');eg.addColorStop(.9,'rgba(50,28,10,0)');eg.addColorStop(1,'rgba(50,28,10,.55)');
  g.fillStyle=eg;g.fillRect(0,0,cw,ch);
  g.textAlign='center';g.textBaseline='middle';
  [...CIPHER].forEach((c,i)=>{
    g.save();g.translate(cw/2+rnd(-1.5,1.5),i*96+50+rnd(-1.5,1.5));g.rotate(rnd(-.04,.04));
    g.fillStyle='rgba(32,16,6,'+rnd(.82,.95)+')';g.font='bold '+Math.round(rnd(58,64))+'px Georgia,serif';g.fillText(c,0,0);g.restore();
  });
  return cv;
}
const leatherCv=leatherCanvas();
const leatherMat=new THREE.MeshStandardMaterial({map:mkTex(leatherCv),bumpMap:new THREE.CanvasTexture(leatherCv),bumpScale:.6,roughness:.82,metalness:0,side:THREE.DoubleSide,transparent:true});

function woodTex(){
  const cv=document.createElement('canvas');cv.width=512;cv.height=256;const g=cv.getContext('2d');
  g.fillStyle='#5a3a22';g.fillRect(0,0,512,256);
  for(let x=0;x<512;x++){
    const w=rnd(.4,2.2);g.fillStyle='rgba('+(Math.random()<.5?'30,16,6':'140,95,55')+','+rnd(.05,.28)+')';
    g.beginPath();g.moveTo(x,0);
    for(let y=0;y<=256;y+=32)g.lineTo(x+Math.sin(y*.03+x*.2)*1.2,y);
    g.lineTo(x+w,256);g.lineTo(x+w,0);g.fill();
  }
  const t=mkTex(cv);t.wrapS=t.wrapT=THREE.RepeatWrapping;return t;
}
const swordMats=[leatherMat];
function mat(o){const m=new THREE.MeshStandardMaterial(Object.assign({transparent:true},o));swordMats.push(m);return m;}
const wood=mat({map:woodTex(),roughness:.6,metalness:0});
const steel=mat({color:0xcfd6dd,metalness:.55,roughness:.28});
const gold=mat({color:0xb8893a,metalness:.5,roughness:.38});
const groove=mat({color:0x7d8791,metalness:.5,roughness:.4});

const SEG=6,NV=N*SEG+1;
const geo=new THREE.BufferGeometry();
const pos=new Float32Array(NV*2*3),uv=new Float32Array(NV*2*2),idx=[];
for(let j=0;j<NV;j++){
  for(let q=0;q<2;q++){const n=j*2+q;uv[n*2]=q;uv[n*2+1]=1-(j/SEG)/N;}
  if(j<NV-1){const a=j*2;idx.push(a,a+2,a+1,a+1,a+2,a+3);}
}
geo.setAttribute('position',new THREE.BufferAttribute(pos,3));
geo.setAttribute('uv',new THREE.BufferAttribute(uv,2));
geo.setIndex(idx);
const strip=new THREE.Mesh(geo,leatherMat);strip.frustumCulled=false;spinG.add(strip);

let sword=null,k=7,flat=0,flatT=0,spin=.3,yawV=-.35,zoom=1;
const radius=()=>W*k/(2*Math.PI);
const gripLen=()=>N/k*W+W;
const bladeW=()=>.9+radius()*.8;
function build(){
  if(sword){spinG.remove(sword);sword.traverse(o=>o.geometry&&o.geometry.dispose());}
  sword=new THREE.Group();
  const R=radius(),gl=gripLen(),bw=bladeW(),BL=4.6;
  const grip=new THREE.Mesh(new THREE.CylinderGeometry(R*.97,R*.97,gl,64),wood);
  grip.rotation.z=Math.PI/2;sword.add(grip);
  const pr=R*1.2+.15;
  const pom=new THREE.Mesh(new THREE.SphereGeometry(pr,32,20),gold);
  pom.scale.set(.8,1,1);pom.position.x=-gl/2-pr*.55;sword.add(pom);
  const gx=gl/2+.12;
  const guard=new THREE.Mesh(new THREE.BoxGeometry(.24,bw*2.1,.42),gold);
  guard.position.x=gx;sword.add(guard);
  const sh=new THREE.Shape();
  sh.moveTo(0,-bw/2);sh.lineTo(BL,-bw/2);sh.lineTo(BL+bw*1.1,0);sh.lineTo(BL,bw/2);sh.lineTo(0,bw/2);sh.closePath();
  const blade=new THREE.Mesh(new THREE.ExtrudeGeometry(sh,{depth:.1,bevelEnabled:true,bevelSize:.04,bevelThickness:.04,bevelSegments:2}),steel);
  blade.position.set(gx+.12,0,-.05);sword.add(blade);
  const fuller=new THREE.Mesh(new THREE.BoxGeometry(BL*.8,.07,.2),groove);
  fuller.position.set(gx+.12+BL*.45,0,0);sword.add(fuller);
  spinG.add(sword);
}
function layout(){
  const R=radius()+.012,cx=N/(2*k)*W;
  for(let j=0;j<NV;j++){
    const s=j/SEG,a=s/k*Math.PI*2;
    for(let q=0;q<2;q++){
      const v=q-.5,n=(j*2+q)*3;
      const wx=s/k*W+v*W-cx,wy=-R*Math.sin(a),wz=R*Math.cos(a);
      const fx=(s-N/2)*W,fy=v*W;
      pos[n]=wx+(fx-wx)*flat;pos[n+1]=wy+(fy-wy)*flat;pos[n+2]=wz*(1-flat);
    }
  }
  geo.attributes.position.needsUpdate=true;geo.computeVertexNormals();
  swordMats.forEach(m=>{if(m!==leatherMat)m.opacity=1-flat;});
  sword.visible=flat<.97;
}
function resize(){
  const w=stage.clientWidth,h=stage.clientHeight;
  renderer.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(stage);resize();

function frame(){
  flat+=(flatT-flat)*.08;if(Math.abs(flatT-flat)<.001)flat=flatT;
  layout();
  spinG.rotation.x=spin*(1-flat);
  yaw.rotation.y=yawV*(1-flat);
  const halfW=(gripLen()/2+2.4)*(1-flat)+(N*W/2+.8)*flat;
  const halfH=(bladeW()+.6)*(1-flat)+1.1*flat;
  const xc=1.2*(1-flat);
  const t=Math.tan(cam.fov*Math.PI/360);
  const d=Math.max(halfW/(t*cam.aspect),halfH/t)*zoom;
  cam.position.set(xc,0,d);cam.lookAt(xc,0,0);
  renderer.setClearColor(getComputedStyle(document.body).backgroundColor);
  renderer.render(scene,cam);
  requestAnimationFrame(frame);
}
build();frame();

let drag=null;
stage.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY};stage.setPointerCapture(e.pointerId);});
stage.addEventListener('pointermove',e=>{
  if(!drag)return;
  const dx=e.clientX-drag.x,dy=e.clientY-drag.y;drag={x:e.clientX,y:e.clientY};
  yawV=Math.max(-1.3,Math.min(1.3,yawV+dx*.008));spin+=dy*.012;
});
stage.addEventListener('pointerup',()=>drag=null);
stage.addEventListener('pointercancel',()=>drag=null);
stage.addEventListener('wheel',e=>{e.preventDefault();zoom=Math.max(.5,Math.min(3,zoom*(1+e.deltaY*.001)));},{passive:false});

const kEl=document.getElementById('k'),msg=document.getElementById('msg');
kEl.addEventListener('input',()=>{k=+kEl.value;document.getElementById('kval').textContent=k;build();});
document.getElementById('unroll').addEventListener('click',e=>{
  flatT=flatT?0:1;e.target.textContent=flatT?'Enrolar':'Desenrolar';
});
function check(){
  const v=document.getElementById('ans').value.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase().replace(/[^A-Z]/g,'');
  if(v==="MOLONLABE"){msg.className='ok';msg.textContent='⚔️ MOLON LABE';}
  else{msg.className='';msg.textContent='Ainda não.';}
}
document.getElementById('go').addEventListener('click',check);
document.getElementById('ans').addEventListener('keydown',e=>{if(e.key==='Enter')check();});
</script>
</body>
</html>
