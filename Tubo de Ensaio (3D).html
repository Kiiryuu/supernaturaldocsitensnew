 else if(cs=='back'){cu=Math.min(1,cu+dt/.7);const e=cu*cu*(3-2*cu);tP.set(0,6.3,0);inner.localToWorld(tP);inner.getWorldQuaternion(tQ);cork.position.lerpVectors(cP,tP,e);cork.position.y+=Math.sin(Math.PI*e)*2;cork.quaternion.slerpQuaternions(cQ,tQ,e);if(cu>=1){inner.attach(cork);cork.position.set(0,6.3,0);cork.quaternion.identity();cs='in'}}}

let ph='idle',mode='',pt=0,tilt=0,tiltT=0,fill=1,fillT=1,doses=10,hist=[];

function ui(){const busy=ph!='idle';[...pips.children].forEach((e,i)=>e.classList.toggle('on',i<doses));bU.disabled=busy||doses<1;bB.disabled=busy||!hist.length}
function go(){ph='tilt';pt=0;tiltT=2.3;uncork();ui()}
bU.onclick=()=>{if(ph!='idle'||doses<1)return;hist.push(doses);doses--;fillT=doses/10;mode='use';go()};
bB.onclick=()=>{if(ph!='idle'||!hist.length)return;doses=hist.pop();fillT=doses/10;mode='rew';go();$('rw').classList.remove('on');void $('rw').offsetWidth;$('rw').classList.add('on')};
function phases(dt){tilt+=(tiltT-tilt)*Math.min(1,dt*3);pt+=dt;
 if(ph=='tilt'&&tilt>2.15&&cs!='out'){ph='pour';pt=0;ringU=mode=='use'?0:1}
 else if(ph=='pour'){const rev=mode=='rew';for(let k=0;k<7;k++)spawnSp(rev);fill+=(fillT-fill)*Math.min(1,dt*2.4);if(Math.abs(fill-fillT)<.004&&pt>.8){fill=fillT;ph='back';tiltT=0}}
 else if(ph=='back'&&tilt<.05){ph='cork';recork()}
 else if(ph=='cork'&&cs=='in')ph='wait';
 else if(ph=='wait'&&spActive==0){ph='idle';ui()}}

let comp=null;if(THREE.EffectComposer&&THREE.UnrealBloomPass){comp=new THREE.EffectComposer(R);comp.addPass(new THREE.RenderPass(S,cam));comp.addPass(new THREE.UnrealBloomPass(new THREE.Vector2(innerWidth/2,innerHeight/2),.8,.8,.9));if(THREE.GammaCorrectionShader)comp.addPass(new THREE.ShaderPass(THREE.GammaCorrectionShader))}

const sw=new V3(),sv=new V3(),sa=new V3(),rt=new V3(),A=new V3(),UP=new V3(0,1,0),nn=new V3(0,1,0),nv=new V3(),nt=new V3(),zz=new V3(0,0,1);
let pAz=ctl.getAzimuthalAngle(),pPo=ctl.getPolarAngle(),last=0,uiT=0;
(function loop(ms){requestAnimationFrame(loop);const t=ms/1000,dt=Math.min(t-last||.016,.033);last=t;ctl.update();
 const az=ctl.getAzimuthalAngle(),po=ctl.getPolarAngle();let da=az-pAz;if(da>3)da-=6.283;if(da<-3)da+=6.283;const wa=cl(da/dt,-6,6),wp=cl((po-pPo)/dt,-6,6);pAz=az;pPo=po;
 rt.setFromMatrixColumn(cam.matrixWorld,0);
 sa.copy(rt).multiplyScalar(-wa*10).addScaledVector(UP,wp*6).addScaledVector(sw,-45).addScaledVector(sv,-4);sv.addScaledVector(sa,dt);sw.addScaledVector(sv,dt);A.copy(sa).multiplyScalar(.35);
 T.position.set(sw.x*.35,PIV+tilt*.45+sw.y*.2,sw.z*.35);T.rotation.set(cl(sw.z*.22,-.5,.5),0,-tilt+cl(-sw.x*.22,-.5,.5));T.updateMatrixWorld(true);
 phases(dt);corkStep(dt);
 // boca do tubo e nível do pó (com "slosh")
 mouth.set(0,LEN,0);inner.localToWorld(mouth);axis.copy(UP).applyQuaternion(T.quaternion);
 nt.set(A.x*.6,G+A.y*.6,A.z*.6).normalize();nv.addScaledVector(tmp.copy(nt).sub(nn),70*dt).multiplyScalar(1-2.5*dt);nn.addScaledVector(nv,dt).normalize();
 U.uN.value.copy(nn);U.uD.value=planeD(nn,fill);U.uInv.value.copy(inner.matrixWorld).invert();U.uT.value=t;
 tmp.copy(T.position);cap.position.copy(tmp).addScaledVector(nn,U.uD.value-tmp.dot(nn));cap.quaternion.setFromUnitVectors(zz,nn);
 lamp.intensity=3+9*fill+Math.sin(t*1.6);lg.material.opacity=(.15+.6*fill)+Math.sin(t*1.6)*.08;
 shadow.position.x=T.position.x;shadow.position.z=T.position.z+.2;shadow.scale.setScalar(1-tilt*.12);
 updSp(t,dt);
 if(ringU>=0){const rev=mode=='rew';ringU+=(rev?-1:1)*dt/1.6;if(ringU>1||ringU<0){ringU=-1;ringM.visible=false}else{ringM.visible=true;ringM.scale.setScalar(.4+ringU*3.8);ringM.material.opacity=(rev?ringU:1-ringU)*.9}}
 glow.material.opacity=.15+.3*fill+Math.sin(t*1.6)*.05;
 if((uiT+=dt)>.3){uiT=0;ui()}
 comp?comp.render():R.render(S,cam)})(0);
