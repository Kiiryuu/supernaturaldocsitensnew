<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>O Pedestal dos Símbolos</title>
<style>
:root{--bg:#050403;--fg:#d9c3a8;box-sizing:border-box}

html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:Georgia,serif;overflow:hidden}
canvas{display:block;touch-action:none}
.hot{position:fixed;left:0;top:0;width:46px;height:46px;margin:-23px 0 0 -23px;padding:0;border-radius:50%;border:2px solid #e8c36a;background:rgba(20,12,8,.55);color:#e8c36a;cursor:pointer;display:none;place-items:center;animation:pulse 2s infinite;z-index:5}
.hot svg{width:24px;height:24px}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(232,195,106,.55)}100%{box-shadow:0 0 0 16px rgba(232,195,106,0)}}
#back{position:fixed;top:max(12px,env(safe-area-inset-top,0px));left:12px;display:none;z-index:6;padding:8px 14px;border-radius:20px;border:1px solid #e8c36a;background:rgba(20,12,8,.6);color:#e8c36a;font:15px Georgia,serif;cursor:pointer}
#hint{position:fixed;left:0;right:0;bottom:max(12px,env(safe-area-inset-bottom,0px));text-align:center;font-size:14px;opacity:.8;pointer-events:none}
</style></head><body>
<button id="back">← Voltar</button>
<div id="hint">Clique no olho (ou num candelabro / no pedestal) para se aproximar · com a câmera num candelabro, clique numa vela para apagá-la ou acendê-la</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const scene=new THREE.Scene();scene.background=new THREE.Color(0x030201);scene.fog=new THREE.Fog(0x030201,6,18);
const cam=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,.1,100);
const r=new THREE.WebGLRenderer({antialias:true});r.setSize(innerWidth,innerHeight);r.setPixelRatio(Math.min(devicePixelRatio,2));
document.body.appendChild(r.domElement);
scene.add(new THREE.AmbientLight(0x1a120d,.35));


const wood=new THREE.MeshLambertMaterial({color:0xc97b57});
const woodD=new THREE.MeshLambertMaterial({color:0xa9603f});
function stoneTex(){const c=document.createElement('canvas');c.width=c.height=256;const g=c.getContext('2d');g.fillStyle='#1f1c19';g.fillRect(0,0,256,256);
 for(let row=0;row<4;row++){const y=row*64,o=row%2?32:0;for(let k=-1;k<4;k++){const v=(75+Math.random()*45)|0;g.fillStyle='rgb('+v+','+(v-4)+','+(v-10)+')';g.fillRect(k*64+o+3,y+3,58,58);}}
 for(let i=0;i<5000;i++){g.fillStyle='rgba(0,0,0,'+(Math.random()*.3)+')';g.fillRect(Math.random()*256,Math.random()*256,2,2);}
 const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.anisotropy=4;return t;}
const baseStone=stoneTex();
function stoneMat(rx,ry){const t=baseStone.clone();t.needsUpdate=true;t.repeat.set(rx,ry);return new THREE.MeshLambertMaterial({map:t});}
const cream=stoneMat(4,1);
const gold=new THREE.MeshStandardMaterial({color:0xd4a437,metalness:.8,roughness:.35});

// plataforma
const st1=new THREE.Mesh(new THREE.BoxGeometry(13,.3,6),cream);st1.position.set(0,.15,0);scene.add(st1);
const st2=new THREE.Mesh(new THREE.BoxGeometry(12,.25,5),woodD);st2.position.set(0,-.12,.3);scene.add(st2);
const room=new THREE.Mesh(new THREE.BoxGeometry(22,8,20),[stoneMat(5,2),stoneMat(5,2),stoneMat(5.5,5),stoneMat(5.5,5),stoneMat(5.5,2),stoneMat(5.5,2)].map(m=>{m.side=THREE.BackSide;return m;}));room.position.set(0,3.75,4);scene.add(room);

// textura dos símbolos
function tex(){
 const c=document.createElement('canvas');c.width=c.height=1024;const g=c.getContext('2d');
 g.fillStyle='#b8694a';g.fillRect(0,0,1024,1024);
 g.shadowColor='#fff';g.shadowBlur=18;g.fillStyle='#fff';g.strokeStyle='#fff';g.lineWidth=7;g.lineCap='round';
 const S=60;
 const eye=(x,y)=>{g.beginPath();g.moveTo(x-S,y);g.quadraticCurveTo(x,y-S*.9,x+S,y);g.quadraticCurveTo(x,y+S*.9,x-S,y);g.stroke();
  g.beginPath();g.arc(x,y,S*.32,0,7);g.fill();
  for(let i=-2;i<=2;i++){g.beginPath();g.moveTo(x+i*S*.35,y-S*.75+Math.abs(i)*8);g.lineTo(x+i*S*.45,y-S*1.15+Math.abs(i)*10);g.stroke();}};
 const skull=(x,y)=>{g.beginPath();g.arc(x,y-8,S*.75,Math.PI*.95,Math.PI*2.05);g.lineTo(x+S*.45,y+S*.5);g.lineTo(x-S*.45,y+S*.5);g.closePath();g.fill();
  g.globalCompositeOperation='destination-out';g.shadowBlur=0;
  g.beginPath();g.arc(x-S*.28,y-6,S*.18,0,7);g.arc(x+S*.28,y-6,S*.18,0,7);g.fill();
  g.beginPath();g.moveTo(x,y+4);g.lineTo(x-7,y+22);g.lineTo(x+7,y+22);g.fill();
  for(let i=-1;i<=1;i++){g.fillRect(x+i*S*.2-2,y+S*.28,4,S*.22);}
  g.globalCompositeOperation='source-over';g.shadowBlur=18;};
 const tri=(x,y)=>{for(let k=0;k<3;k++){const a=k*Math.PI*2/3-Math.PI/2;g.beginPath();
  for(let t=0;t<=1;t+=.05){const ang=a+t*Math.PI*1.1,rad=S*(.12+.8*t);g.lineTo(x+Math.cos(ang)*rad,y+Math.sin(ang)*rad);}g.stroke();}
  g.beginPath();g.arc(x,y,S*.12,0,7);g.fill();};
 const pent=(x,y)=>{g.beginPath();for(let k=0;k<5;k++){const a=-Math.PI/2+k*4*Math.PI/5;g.lineTo(x+Math.cos(a)*S*.85,y+Math.sin(a)*S*.85);}g.closePath();g.stroke();
  g.beginPath();g.arc(x,y,S*.95,0,7);g.lineWidth=4;g.stroke();g.lineWidth=7;};
 const P=(x,y)=>[(x-600)*.9+512,(y-540)*.9+512];
 const L=[[600,300,eye],[400,330,pent],[785,330,pent],[600,445,pent],[330,575,pent],[840,580,pent],
  [430,465,skull],[740,465,skull],[600,590,tri],[455,715,tri],[730,715,tri]];
 L.forEach(([x,y,f])=>{const p=P(x,y);f(p[0],p[1]);});
 const t=new THREE.CanvasTexture(c);t.anisotropy=8;return t;
}
// pedestal octogonal
const R=1.7,Ri=1.4,off=Math.PI/8;
function oct(rad){const s=new THREE.Shape();for(let k=0;k<8;k++){const a=off+k*Math.PI/4;const x=Math.cos(a)*rad,y=Math.sin(a)*rad;k?s.lineTo(x,y):s.moveTo(x,y);}s.closePath();return s;}
const outer=oct(R);outer.holes.push(new THREE.Path(oct(Ri).getPoints()));
const rim=new THREE.Mesh(new THREE.ExtrudeGeometry(outer,{depth:.4,bevelEnabled:true,bevelSize:.04,bevelThickness:.04,bevelSegments:1}),wood);
rim.rotation.x=-Math.PI/2;rim.position.y=1.5;scene.add(rim);
const t=tex();t.repeat.set(1/(2*Ri),1/(2*Ri));t.offset.set(.5,.5);
const fl=new THREE.Mesh(new THREE.ShapeGeometry(oct(Ri)),new THREE.MeshLambertMaterial({map:t}));
fl.rotation.x=-Math.PI/2;fl.position.y=1.62;scene.add(fl);
// água cristalina (superfície octogonal com ondulação)
const wg=new THREE.RingGeometry(0.001,1,64,18);
{const a0=Ri*Math.cos(Math.PI/8)-.015,p=wg.attributes.position;
 for(let i=0;i<p.count;i++){const x=p.getX(i),y=p.getY(i),rho=Math.hypot(x,y),th=Math.atan2(y,x);
  const d=(((th+Math.PI/8)%(Math.PI/4))+Math.PI/4)%(Math.PI/4)-Math.PI/8;const R2=a0/Math.cos(d);
  p.setXY(i,Math.cos(th)*rho*R2,Math.sin(th)*rho*R2);}
 wg.userData.base=p.array.slice();}
const water=new THREE.Mesh(wg,new THREE.MeshStandardMaterial({color:0x5f9fbd,transparent:true,opacity:.42,roughness:.04,metalness:.15,depthWrite:false}));
water.rotation.x=-Math.PI/2;water.position.y=1.8;scene.add(water);
function ripple(T){const p=wg.attributes.position,b=wg.userData.base;
 for(let i=0;i<p.count;i++){const x=b[i*3],y=b[i*3+1];
  p.setZ(i,.012*(Math.sin(x*8+T*1.8)+Math.sin(y*10-T*1.5)+Math.sin((x+y)*6+T*1.1))+.004*Math.sin(Math.hypot(x,y)*18-T*3));}
 p.needsUpdate=true;wg.computeVertexNormals();}
const bowl=new THREE.Mesh(new THREE.CylinderGeometry(R,1.2,.3,8),wood);bowl.rotation.y=off;bowl.position.y=1.4;scene.add(bowl);
const stem=new THREE.Mesh(new THREE.CylinderGeometry(.7,.8,.9,8),woodD);stem.rotation.y=off;stem.position.y=.95;scene.add(stem);
const foot=new THREE.Mesh(new THREE.CylinderGeometry(1.2,1.3,.2,8),wood);foot.rotation.y=off;foot.position.y=.4;scene.add(foot);

// candelabros
const flames=[],smoke=[],hits=[],viewHits=[];
function candelabrum(x,n,lit){
 const g=new THREE.Group();g.position.set(x,.3,.9);
 const base=new THREE.Mesh(new THREE.CylinderGeometry(.35,.45,.12,24),gold);base.position.y=.06;g.add(base);
 for(let s=0;s<2;s++){const pts=[];for(let i=0;i<=40;i++){const u=i/40,a=u*Math.PI*4+s*Math.PI;pts.push(new THREE.Vector3(Math.cos(a)*.07*(1-u*.4),.1+u*1.7,Math.sin(a)*.07*(1-u*.4)));}
  g.add(new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts),60,.03,6),gold));}
 const slots=[];const ar=[];
 for(let i=0;i<5;i++){const u=i/4-.5;const p=new THREE.Vector3(u*1.3,1.85+(.5-Math.abs(u))*.0-Math.abs(u)*.0+(Math.abs(u)>.4?.15:0)+ (.25-u*u)*.5,0);slots.push(p);ar.push(p.clone());}
 const curve=new THREE.CatmullRomCurve3([new THREE.Vector3(0,1.75,0),...ar.map(p=>new THREE.Vector3(p.x,p.y-.08,0))].sort((a,b)=>a.x-b.x));
 g.add(new THREE.Mesh(new THREE.TubeGeometry(curve,50,.025,6),gold));
 const idx={1:[2],2:[1,3],3:[1,2,3],5:[0,1,2,3,4]}[n];
 slots.forEach((p,i)=>{
  const cup=new THREE.Mesh(new THREE.CylinderGeometry(.08,.04,.06,12),gold);cup.position.set(p.x,p.y-.04,0);g.add(cup);
  if(!idx.includes(i))return;
  const can=new THREE.Mesh(new THREE.CylinderGeometry(.045,.045,.4,12),new THREE.MeshLambertMaterial({color:0xfbf3e4}));can.position.set(p.x,p.y+.19,0);g.add(can);
  const wick=new THREE.Mesh(new THREE.CylinderGeometry(.006,.006,.05),new THREE.MeshBasicMaterial({color:0x222222}));wick.position.set(p.x,p.y+.42,0);g.add(wick);
  {const f=new THREE.Mesh(new THREE.SphereGeometry(.05,10,10),new THREE.MeshBasicMaterial({color:0xffc04d}));f.scale.set(1,2.2,1);f.position.set(p.x,p.y+.5,0);f.visible=lit;g.add(f);
   const pl=new THREE.PointLight(0xff9a40,lit?1.2:0,9,2);pl.position.copy(f.position);g.add(pl);const o={f,pl,ph:Math.random()*9,lit:lit};flames.push(o);const hit=new THREE.Mesh(new THREE.CylinderGeometry(.13,.13,.7,8),new THREE.MeshBasicMaterial({visible:false}));hit.position.set(p.x,p.y+.3,0);hit.userData.o=o;g.add(hit);hits.push(hit);}
 });
 scene.add(g);
 const hb=new THREE.Mesh(new THREE.BoxGeometry(1.7,2.4,.7),new THREE.MeshBasicMaterial({visible:false}));hb.position.set(x,1.5,.9);hb.userData.view={pos:[x*.9,2.3,3.4],tgt:[x,1.9,.9]};scene.add(hb);viewHits.push(hb);
}
candelabrum(-4.4,2,false);   // 2 apagadas
candelabrum(-2.9,3,true);    // 3 acesas
candelabrum(2.9,1,false);    // 1 apagada
candelabrum(4.4,5,true);     // 5 acesas

// câmera orbital
let az=0,el=.45,dist=9,tz=1.4;
const back=document.getElementById('back');
const VIEWS={over:{pos:[0,3.4,9],tgt:[0,1.7,0]},ped:{pos:[0,4.3,2.3],tgt:[0,1.7,.1]}};
function fit(){const p=innerWidth<innerHeight;cam.fov=p?72:45;cam.updateProjectionMatrix();VIEWS.over.pos[2]=p?11.5:9;}
fit();addEventListener('resize',fit);
const cp=new THREE.Vector3(...VIEWS.over.pos),ct=new THREE.Vector3(...VIEWS.over.tgt);let tw=null,cur=null;
function go(v){cur=v===VIEWS.over?null:v;back.style.display='none';tw={t0:performance.now(),p0:cp.clone(),p1:new THREE.Vector3(...v.pos),a0:ct.clone(),a1:new THREE.Vector3(...v.tgt)};}
function arrived(){back.style.display=cur?'block':'none';}
back.onclick=()=>{audioInit();go(VIEWS.over);};
const ph=new THREE.Mesh(new THREE.CylinderGeometry(1.8,1.8,2.2,8),new THREE.MeshBasicMaterial({visible:false}));ph.position.set(0,1.2,0);ph.userData.view=VIEWS.ped;scene.add(ph);viewHits.push(ph);
const EYE=`<svg viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z'/><circle cx='12' cy='12' r='3'/></svg>`;
const hot=[];
viewHits.forEach(h=>{const b=document.createElement('button');b.className='hot';b.setAttribute('aria-label','Aproximar');b.innerHTML=EYE;b.onclick=()=>{audioInit();go(h.userData.view);};document.body.appendChild(b);hot.push({b,a:new THREE.Vector3(h.position.x,h===ph?2.4:3.1,h===ph?0:.9)});});
const tmpV=new THREE.Vector3();
function updateHot(){const show=!tw&&!cur;hot.forEach(h=>{if(!show){h.b.style.display='none';return;}tmpV.copy(h.a).project(cam);if(tmpV.z>1){h.b.style.display='none';return;}h.b.style.display='grid';h.b.style.transform='translate('+((tmpV.x+1)/2*innerWidth)+'px,'+((1-tmpV.y)/2*innerHeight)+'px)';});}
// áudio
let AC=null,wMaster=null;const wp=new THREE.Vector3(0,1.8,0);
function noiseBuf(sec){const n=Math.floor(AC.sampleRate*sec),b=AC.createBuffer(1,n,AC.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.random()*2-1;return b;}
function audioInit(){try{if(AC){if(AC.state==='suspended')AC.resume();return;}AC=new (window.AudioContext||window.webkitAudioContext)();}catch(_){}}
function startWater(){wMaster=AC.createGain();wMaster.gain.value=.05;wMaster.connect(AC.destination);
 const s=AC.createBufferSource();s.buffer=noiseBuf(3);s.loop=true;
 const bp=AC.createBiquadFilter();bp.type='bandpass';bp.frequency.value=750;bp.Q.value=.7;
 const lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=1600;
 const g=AC.createGain();g.gain.value=.45;s.connect(bp);bp.connect(lp);lp.connect(g);g.connect(wMaster);s.start();
 const lfo=AC.createOscillator(),lg=AC.createGain();lfo.frequency.value=.4;lg.gain.value=250;lfo.connect(lg);lg.connect(bp.frequency);lfo.start();
 setTimeout(drip,800);}
function drip(){if(AC&&wMaster){const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain(),f=500+Math.random()*900;o.type='sine';o.frequency.setValueAtTime(f,t);o.frequency.exponentialRampToValueAtTime(f*1.8,t+.07);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.3,t+.005);g.gain.exponentialRampToValueAtTime(.001,t+.16);o.connect(g);g.connect(wMaster);o.start(t);o.stop(t+.2);}setTimeout(drip,500+Math.random()*1800);}
function blowSound(){if(!AC)return;const t=AC.currentTime;
 const s=AC.createBufferSource();s.buffer=noiseBuf(.6);const f=AC.createBiquadFilter();f.type='bandpass';f.Q.value=.7;f.frequency.setValueAtTime(2500,t);f.frequency.exponentialRampToValueAtTime(700,t+.35);
 const g=AC.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.4,t+.04);g.gain.exponentialRampToValueAtTime(.001,t+.45);s.connect(f);f.connect(g);g.connect(AC.destination);s.start(t);
 const s2=AC.createBufferSource();s2.buffer=noiseBuf(.6);const h=AC.createBiquadFilter();h.type='highpass';h.frequency.value=4500;
 const g2=AC.createGain();g2.gain.setValueAtTime(0,t+.1);g2.gain.linearRampToValueAtTime(.15,t+.14);g2.gain.exponentialRampToValueAtTime(.001,t+.6);s2.connect(h);h.connect(g2);g2.connect(AC.destination);s2.start(t+.1);}
let drag=null,pin=0;const pts=new Map();
const el_=r.domElement;
let down=null;
el_.addEventListener('pointerdown',e=>{el_.setPointerCapture(e.pointerId);pts.set(e.pointerId,e);down={x:e.clientX,y:e.clientY,n:pts.size};});
el_.addEventListener('pointerup',e=>{const one=pts.size===1;pts.delete(e.pointerId);
 if(down&&one&&down.n===1&&Math.hypot(e.clientX-down.x,e.clientY-down.y)<6)pick(e);down=null;});
const ray=new THREE.Raycaster(),mv=new THREE.Vector2();
function pick(e){const b=el_.getBoundingClientRect();mv.set((e.clientX-b.left)/b.width*2-1,-((e.clientY-b.top)/b.height)*2+1);ray.setFromCamera(mv,cam);audioInit();if(tw)return;
 if(!cur){const v=ray.intersectObjects(viewHits,false)[0];if(v)go(v.object.userData.view);return;}
 for(const i of ray.intersectObjects(hits,false)){if(cur===VIEWS.ped||Math.abs(i.point.x-cur.tgt[0])>1)continue;const o=i.object.userData.o;if(o.lit)snuff(o);else relight(o);break;}}
function relight(o){igniteSound();o.lit=true;o.f.visible=true;o.pl.intensity=1.1;}
function igniteSound(){if(!AC)return;const t=AC.currentTime,s=AC.createBufferSource();s.buffer=noiseBuf(.4);const f=AC.createBiquadFilter();f.type='bandpass';f.Q.value=1.2;f.frequency.setValueAtTime(1200,t);f.frequency.exponentialRampToValueAtTime(3500,t+.15);const g=AC.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.25,t+.03);g.gain.exponentialRampToValueAtTime(.001,t+.3);s.connect(f);f.connect(g);g.connect(AC.destination);s.start(t);}
function snuff(o){blowSound();o.lit=false;o.f.visible=false;o.pl.intensity=0;const w=new THREE.Vector3();o.f.getWorldPosition(w);
 for(let k=0;k<7;k++){const m=new THREE.Mesh(new THREE.SphereGeometry(.035,8,8),new THREE.MeshBasicMaterial({color:0x888078,transparent:true,opacity:.5,depthWrite:false}));m.position.copy(w);m.visible=false;scene.add(m);smoke.push({m,t:-k*.12,dx:(Math.random()-.5)*.004});}}
el_.addEventListener('pointermove',e=>{
 if(!pts.has(e.pointerId))return;const p=pts.get(e.pointerId);
 if(pts.size===1){az-=(e.clientX-p.clientX)*.007;el=Math.max(.05,Math.min(1.5,el+(e.clientY-p.clientY)*.007));}
 else if(pts.size===2){const o=[...pts.values()].find(q=>q.pointerId!==e.pointerId);
  const d0=Math.hypot(p.clientX-o.clientX,p.clientY-o.clientY),d1=Math.hypot(e.clientX-o.clientX,e.clientY-o.clientY);dist=Math.max(3,Math.min(10,dist*d0/d1));}
 pts.set(e.pointerId,e);});
el_.addEventListener('wheel',e=>{dist=Math.max(3,Math.min(10,dist+e.deltaY*.005));e.preventDefault();},{passive:false});
addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();r.setSize(innerWidth,innerHeight);});
function loop(ti){
 const T=ti*.001;
 if(tw){let u=Math.min(1,(ti-tw.t0)/1500);u=u<.5?4*u*u*u:1-Math.pow(-2*u+2,3)/2;cp.lerpVectors(tw.p0,tw.p1,u);ct.lerpVectors(tw.a0,tw.a1,u);if(u>=1){tw=null;arrived();}}
 cam.position.copy(cp);cam.lookAt(ct);updateHot();
 if(wMaster){const k=Math.max(0,1-cp.distanceTo(wp)/10);wMaster.gain.value=.04+.5*k*k;}
 flames.forEach(o=>{if(!o.lit)return;const s=1+Math.sin(T*9+o.ph)*.12+Math.sin(T*17+o.ph)*.06;o.f.scale.set(s,2.2*s,s);o.pl.intensity=1.1+Math.sin(T*11+o.ph)*.2+Math.sin(T*23+o.ph)*.08;});
 for(let i=smoke.length-1;i>=0;i--){const s=smoke[i];s.t+=.016;if(s.t<0)continue;s.m.visible=true;s.m.position.y+=.007;s.m.position.x+=s.dx;s.m.scale.multiplyScalar(1.015);s.m.material.opacity=.5*(1-s.t/2);if(s.t>2){scene.remove(s.m);smoke.splice(i,1);}}
 ripple(T);
 r.render(scene,cam);requestAnimationFrame(loop);}
requestAnimationFrame(loop);
</script></body></html>
