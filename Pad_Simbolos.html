<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pad de Símbolos</title>
<style>
html,body{margin:0;height:100%;background:#050505;overflow:hidden;font-family:Georgia,'Times New Roman',serif;user-select:none;-webkit-user-select:none;touch-action:none}
canvas{display:block}
.ov{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;box-sizing:border-box;z-index:10}
#start{display:flex;background:radial-gradient(circle,#000a 0%,#000e 100%)}
#go{font:bold clamp(16px,3.4vw,26px) Georgia,serif;color:#ff2a2a;background:#000;border:2px solid #ff2a2a;padding:18px 30px;cursor:pointer;letter-spacing:.04em;text-shadow:0 0 12px #f00a;box-shadow:0 0 24px #f003;max-width:92vw}
#go:hover{background:#2a0000;box-shadow:0 0 36px #f006}
#wait{background:#000d}
#wait h1{margin:0;font-size:clamp(28px,7vw,64px);color:#ff2a2a;letter-spacing:.06em;text-shadow:0 0 24px #f00}
#wait p,#win p,#lose p{color:#9a8a7a;font-size:clamp(13px,2.4vw,18px);margin:14px 0 0}
#wait button{margin-top:26px;font:13px Georgia,serif;color:#8a7a6a;background:none;border:1px solid #4a3a3a;padding:8px 14px;cursor:pointer;opacity:.7}
#win{background:#001a08e6}#win h1{margin:0;font-size:clamp(28px,7vw,60px);color:#4dff88;text-shadow:0 0 24px #0f6}
#lose{background:#200000ee}#lose h1{margin:0;font-size:clamp(34px,9vw,80px);color:#ff2a2a;text-shadow:0 0 30px #f00}
.ov button.again{margin-top:26px;font:16px Georgia,serif;color:#e8dcc6;background:#000;border:1px solid #6a5a3a;padding:10px 20px;cursor:pointer}
#master{position:fixed;left:10px;top:10px;z-index:11;display:none;background:#000c;border:1px solid #6a5a3a;color:#e8dcc6;padding:10px 14px;font-size:16px;line-height:1.5;max-width:70vw}
#master b{color:#d2a85a}
#vig{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 45%,#000b 100%)}
#flash{position:fixed;inset:0;pointer-events:none;background:#f00;opacity:0}
</style></head><body>
<div id="vig"></div><div id="flash"></div>
<div id="master"></div>
<div id="start" class="ov"><button id="go">Começar: Atenção Não existe pause.</button></div>
<div id="wait" class="ov"><h1>Espere o mestre narrar</h1><p>O cronômetro está parado. Ao continuar, o tempo cai 30 segundos.</p><button id="cont">mestre: continuar (Enter)</button></div>
<div id="win" class="ov"><h1>Módulo desarmado</h1><p id="winp"></p><button class="again" id="a1">Jogar de novo</button></div>
<div id="lose" class="ov"><h1>BOOM</h1><p>O tempo acabou.</p><button class="again" id="a2">Tentar de novo</button></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const T=THREE,PI=Math.PI,clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
// ================= CONFIGURAÇÃO =================
const TEMPO=10*60;                       // 10 minutos
// Ordem CORRETA em que os símbolos devem ser apertados (é isto que vai no manual do mestre).
const ORDEM=['Ϙ','Ѧ','ƛ','Җ','Ӝ','★','☆','¿','¶','Ψ','Ѯ','б','Ӭ','©','Ѣ','Ω'];
// Posição dos símbolos nos pads: embaralhamento fixo (mude com ?seed=NUMERO na URL).
const SEED=+(new URLSearchParams(location.search).get('seed'))||7;
function rng(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const rand=rng(SEED),LAYOUT=ORDEM.map((_,i)=>i);for(let i=15;i>0;i--){const j=Math.floor(rand()*(i+1));[LAYOUT[i],LAYOUT[j]]=[LAYOUT[j],LAYOUT[i]]}
// LAYOUT[posição do pad] = índice na ORDEM
// ================= RENDER =================
const R=new T.WebGLRenderer({antialias:true});R.setPixelRatio(Math.min(devicePixelRatio,2));R.setClearColor(0x050505);document.body.prepend(R.domElement);
const scene=new T.Scene();scene.fog=new T.FogExp2(0x050505,.012);
const cam=new T.PerspectiveCamera(40,1,.1,100);let mx=0,my=0,cx=0,cy=0;
function fit(){R.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();const t=Math.tan(20*PI/180),h=14.2/(2*t),w=11.2/(cam.aspect*2*t);cam.userData.d=Math.max(h,w)}
addEventListener('resize',fit);fit();
function noise(x,n,a){for(let i=0;i<n;i++){x.fillStyle=`rgba(${Math.random()<.5?0:255},${Math.random()<.5?0:255},${Math.random()<.5?0:255},${Math.random()*a})`;x.fillRect(Math.random()*x.canvas.width,Math.random()*x.canvas.height,1.5,1.5)}}
function metalTex(){const c=document.createElement('canvas');c.width=c.height=512;const x=c.getContext('2d'),g=x.createLinearGradient(0,0,512,512);g.addColorStop(0,'#4a4c52');g.addColorStop(.5,'#34363b');g.addColorStop(1,'#43454a');x.fillStyle=g;x.fillRect(0,0,512,512);
for(let i=0;i<260;i++){x.strokeStyle=`rgba(${Math.random()<.5?255:0},${Math.random()<.5?255:0},${Math.random()<.5?255:0},${Math.random()*.06})`;x.lineWidth=Math.random()*1.4;const y=Math.random()*512;x.beginPath();x.moveTo(0,y);x.lineTo(512,y+(Math.random()-.5)*8);x.stroke()}
for(let i=0;i<14;i++){x.strokeStyle='rgba(0,0,0,.35)';x.lineWidth=1;let a=Math.random()*512,b=Math.random()*512;x.beginPath();x.moveTo(a,b);x.lineTo(a+(Math.random()-.5)*90,b+(Math.random()-.5)*90);x.stroke()}
for(let i=0;i<40;i++){const cx0=Math.random()*512,cy0=Math.random()*512,r=20+Math.random()*60,gg=x.createRadialGradient(cx0,cy0,0,cx0,cy0,r);gg.addColorStop(0,'rgba(0,0,0,.14)');gg.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=gg;x.fillRect(cx0-r,cy0-r,r*2,r*2)}
noise(x,9000,.08);const t=new T.CanvasTexture(c);t.anisotropy=4;return t}
const softTex=(()=>{const c=document.createElement('canvas');c.width=c.height=128;const x=c.getContext('2d'),g=x.createRadialGradient(64,64,0,64,64,64);g.addColorStop(0,'rgba(255,255,255,.95)');g.addColorStop(.45,'rgba(255,255,255,.3)');g.addColorStop(1,'rgba(255,255,255,0)');x.fillStyle=g;x.fillRect(0,0,128,128);return new T.CanvasTexture(c)})();
const FONT='"Segoe UI Symbol","Noto Sans Symbols2","Noto Sans Symbols","Noto Sans","DejaVu Sans","Arial Unicode MS",Georgia,serif';
function labelTex(ch){const c=document.createElement('canvas');c.width=c.height=256;const x=c.getContext('2d');
const g=x.createLinearGradient(0,0,256,256);g.addColorStop(0,'#e9e1cc');g.addColorStop(1,'#cfc5ab');x.fillStyle=g;x.fillRect(0,0,256,256);noise(x,3500,.1);
x.fillStyle='#0b0b0b';x.textAlign='center';x.textBaseline='middle';x.font='bold 170px '+FONT;x.fillText(ch,128,136);const t=new T.CanvasTexture(c);t.anisotropy=4;return t}
// ================= MÓDULO =================
const mod=new T.Group();mod.rotation.x=-.32;scene.add(mod);
const PW=10,PH=12.4,PITCH=1.9;
const mt=metalTex(),metalMat=new T.MeshStandardMaterial({map:mt,metalness:.7,roughness:.55}),darkMat=new T.MeshStandardMaterial({color:0x0d0d10,metalness:.5,roughness:.6}),side=new T.MeshStandardMaterial({color:0x1a1b1f,metalness:.7,roughness:.5});
const plate=new T.Mesh(new T.BoxGeometry(PW,PH,.6),[side,side,side,side,metalMat,side]);plate.position.z=-.3;mod.add(plate);
const bezel=new T.Mesh(new T.BoxGeometry(PW+.5,PH+.5,.4),side);bezel.position.z=-.75;mod.add(bezel);
// parafusos
[[-1,-1],[1,-1],[-1,1],[1,1]].forEach(([a,b])=>{const s=new T.Mesh(new T.CylinderGeometry(.22,.22,.12,16).rotateX(PI/2),new T.MeshStandardMaterial({color:0x8a8c92,metalness:.9,roughness:.35})),sl=new T.Mesh(new T.BoxGeometry(.3,.05,.03),darkMat);s.position.set(a*(PW/2-.5),b*(PH/2-.5),.04);sl.position.set(a*(PW/2-.5),b*(PH/2-.5),.11);sl.rotation.z=(a*b)*.7;mod.add(s,sl)});
// visor do cronômetro
const lcdC=document.createElement('canvas');lcdC.width=512;lcdC.height=160;const lcdX=lcdC.getContext('2d'),lcdT=new T.CanvasTexture(lcdC);
function lcd(txt,col){lcdX.fillStyle='#120303';lcdX.fillRect(0,0,512,160);lcdX.font='bold 112px "Courier New",monospace';lcdX.textAlign='center';lcdX.textBaseline='middle';lcdX.fillStyle='#2a0707';lcdX.fillText('88:88',256,86);lcdX.shadowColor=col;lcdX.shadowBlur=24;lcdX.fillStyle=col;lcdX.fillText(txt,256,86);lcdX.shadowBlur=0;lcdT.needsUpdate=true}
lcd('--:--','#ff3030');
const lcdFrame=new T.Mesh(new T.BoxGeometry(6.4,1.9,.2),darkMat);lcdFrame.position.set(-.8,4.9,.1);mod.add(lcdFrame);
const lcdM=new T.Mesh(new T.PlaneGeometry(6,1.5),new T.MeshBasicMaterial({map:lcdT}));lcdM.position.set(-.8,4.9,.22);mod.add(lcdM);
// luz de status
const led=new T.Mesh(new T.SphereGeometry(.42,20,16),new T.MeshStandardMaterial({color:0x300000,emissive:0x000000,roughness:.3}));led.position.set(3.7,4.9,.3);mod.add(led);
const ledRing=new T.Mesh(new T.TorusGeometry(.55,.1,10,32),darkMat);ledRing.position.set(3.7,4.9,.2);mod.add(ledRing);
const ledLight=new T.PointLight(0x00ff55,0,6);ledLight.position.set(3.7,4.9,1.5);mod.add(ledLight);
function setLed(c,i){led.material.color.setHex(i?c:0x300000);led.material.emissive.setHex(i?c:0);led.material.emissiveIntensity=i;ledLight.color.setHex(c);ledLight.intensity=i*1.2}
// pads
function rshape(w,r){const s=new T.Shape(),h=w/2;s.moveTo(-h+r,-h);s.lineTo(h-r,-h);s.quadraticCurveTo(h,-h,h,-h+r);s.lineTo(h,h-r);s.quadraticCurveTo(h,h,h-r,h);s.lineTo(-h+r,h);s.quadraticCurveTo(-h,h,-h,h-r);s.lineTo(-h,-h+r);s.quadraticCurveTo(-h,-h,-h+r,-h);return s}
const padGeo=new T.ExtrudeGeometry(rshape(1.5,.16),{depth:.36,bevelEnabled:true,bevelThickness:.06,bevelSize:.06,bevelSegments:3,curveSegments:8});
const pads=[],GY=-.9,REST=.14,DOWN=-.1;
for(let i=0;i<16;i++){const r=Math.floor(i/4),c=i%4,x=(c-1.5)*PITCH,y=GY+(1.5-r)*PITCH,ord=LAYOUT[i],ch=ORDEM[ord];
const slot=new T.Mesh(new T.BoxGeometry(1.86,1.86,.02),new T.MeshBasicMaterial({color:0x000000}));slot.position.set(x,y,.011);mod.add(slot);
[[0,.95,1.96,.1],[0,-.95,1.96,.1],[.95,0,.1,1.96],[-.95,0,.1,1.96]].forEach(([dx,dy,w,h])=>{const f=new T.Mesh(new T.BoxGeometry(w,h,.26),side);f.position.set(x+dx,y+dy,.13);mod.add(f)});
const g=new T.Group();g.position.set(x,y,REST);
const bm=new T.MeshStandardMaterial({color:0xd9d0b8,roughness:.45,metalness:.05,emissive:0x000000}),body=new T.Mesh(padGeo,bm);
const lm=new T.MeshBasicMaterial({map:labelTex(ch),color:0xffffff}),lab=new T.Mesh(new T.PlaneGeometry(1.34,1.34),lm);lab.position.z=.425;
const gm=new T.MeshBasicMaterial({map:softTex,color:0x38ff6e,transparent:true,opacity:0,blending:T.AdditiveBlending,depthWrite:false}),gl=new T.Mesh(new T.PlaneGeometry(3.2,3.2),gm);gl.position.z=.7;gl.raycast=()=>{};
g.add(body,lab,gl);mod.add(g);
const L=new T.PointLight(0x30ff60,0,4.5);L.position.set(x,y,1.4);mod.add(L);
body.userData.pad=lab.userData.pad=i;
const p={i,ch,ord,g,bm,lm,gm,L,z:REST,v:0,tz:REST,lit:0,tl:0,down:false,red:0,resetAt:0,hover:0,x,y};pads.push(p)}
// luzes da sala
scene.add(new T.AmbientLight(0x6a6a80,.55));
const key=new T.SpotLight(0xfff0d8,1.6,60,.7,.6);key.position.set(2,12,16);key.target=mod;scene.add(key);
const rim=new T.PointLight(0x4060a0,.6,40);rim.position.set(-10,4,8);scene.add(rim);
// mesa
const table=new T.Mesh(new T.PlaneGeometry(120,80),new T.MeshStandardMaterial({color:0x0b0a09,roughness:.9}));table.rotation.x=-PI/2;table.position.y=-9;scene.add(table);
// ================= SOM =================
let AC=null,master=null,nb=null;
function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=.85;master.connect(AC.destination);nb=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate);const d=nb.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;ambient()}catch(e){AC=null}}if(AC&&AC.state==='suspended')AC.resume()}
function env(g,t,a,d,v){g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+a);g.gain.exponentialRampToValueAtTime(.0001,t+a+d)}
function tone(f,d,type,v,f2,delay){if(!AC)return;const t=AC.currentTime+(delay||0),o=AC.createOscillator(),g=AC.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);env(g,t,.006,d,v);o.connect(g);g.connect(master);o.start(t);o.stop(t+d+.1)}
function nz(d,f,q,v,type,delay,f2){if(!AC)return;const t=AC.currentTime+(delay||0),s=AC.createBufferSource(),fl=AC.createBiquadFilter(),g=AC.createGain();s.buffer=nb;fl.type=type||'bandpass';fl.frequency.setValueAtTime(f,t);if(f2)fl.frequency.exponentialRampToValueAtTime(f2,t+d);fl.Q.value=q;env(g,t,Math.min(.01,d/4),d,v);s.connect(fl);fl.connect(g);g.connect(master);s.start(t,Math.random());s.stop(t+d+.1)}
const sfx={
 press(){nz(.04,1800,2,.4);tone(140,.12,'sine',.4,60);nz(.05,700,1,.25,'bandpass',.05)},
 ok(){tone(660,.14,'triangle',.18);tone(990,.22,'triangle',.16,null,.07);nz(.03,3500,3,.12)},
 stab(){[0,.09,.18].forEach((d,i)=>{nz(.22,5000,.8,.55,'highpass',d);[1760,2093,2637,3136].forEach((f,k)=>tone(f*(1+i*.04),.32,'sawtooth',.1,f*1.18,d+k*.004))});tone(70,.5,'sine',.55,32,.02);nz(.12,300,1,.5,'lowpass',.02)},
 reset(i){nz(.05,1400+i*60,3,.18,'bandpass',i*.045);tone(120,.07,'sine',.15,70,i*.045)},
 tick(low){tone(low?1500:900,.025,'square',low?.05:.03)},
 win(){[523,659,784,1047].forEach((f,i)=>tone(f,.9,'triangle',.18,null,i*.13));nz(.08,2500,2,.2)},
 boom(){nz(1.8,200,.5,.9,'lowpass');tone(60,1.5,'sine',.9,25);nz(.4,2000,1,.6,'bandpass')}};
function ambient(){const mk=(f,v)=>{const o=AC.createOscillator(),g=AC.createGain();o.type='sine';o.frequency.value=f;g.gain.value=v;o.connect(g);g.connect(master);o.start()};mk(50,.04);mk(50.6,.03);mk(75,.012)}
// ================= JOGO =================
const $=id=>document.getElementById(id);
let running=false,locked=false,step=0,t0=0,lastSec=-1,over=false;
function lcdTime(rem){const s=Math.max(0,Math.ceil(rem)),m=Math.floor(s/60),ss=s%60;return String(m).padStart(2,'0')+':'+String(ss).padStart(2,'0')}
function resetAll(instant){step=0;pads.forEach((p,k)=>{p.down=false;p.tl=0;p.tz=REST;p.red=0;if(instant){p.z=REST;p.v=0;p.lit=0}else{p.resetAt=performance.now()+k*45}})}
function init(){running=false;locked=false;over=false;lastSec=-1;resetAll(true);lcd('--:--','#ff3030');setLed(0,0);['wait','win','lose'].forEach(i=>$(i).style.display='none');$('start').style.display='flex'}
function begin(){ac();$('start').style.display='none';running=true;t0=performance.now();lastSec=-1;lcd(lcdTime(TEMPO),'#ff3030')}
let wrongPad=null,pauseAt=0;const PENALIDADE=30;
function wrong(p){locked=true;pauseAt=performance.now();wrongPad=p;p.red=1;sfx.stab();setLed(0xff2020,2);bump=1;const f=$('flash');f.style.transition='none';f.style.opacity='.55';requestAnimationFrame(()=>{f.style.transition='opacity .9s';f.style.opacity='0'});
 setTimeout(()=>{if(over)return;pads.forEach((q,k)=>{if(q.down)sfx.reset(k)});resetAll(false);setTimeout(()=>{if(over||!locked)return;$('wait').style.display='flex';setLed(0,0)},520)},420)}
function release(){if(!locked||over)return;const n=performance.now();t0+=(n-pauseAt)-PENALIDADE*1000;pauseAt=0;lastSec=-1;wrongPad=null;$('wait').style.display='none';locked=false}
function press(i){if(!running||locked||over)return;const p=pads[i];if(p.down)return;
 if(p.ord===step){p.down=true;p.tz=DOWN;p.tl=1;step++;sfx.press();sfx.ok();setLed(0x20ff60,.8);setTimeout(()=>{if(running&&!locked)setLed(0,0)},350);
  if(step===16)win()}
 else{p.tz=DOWN;wrong(p)}}
function win(){over=true;running=false;setLed(0x20ff60,2.2);sfx.win();const rem=TEMPO-(performance.now()-t0)/1000;$('winp').textContent='Tempo restante: '+lcdTime(rem);setTimeout(()=>{$('win').style.display='flex'},900)}
function lose(){over=true;running=false;locked=false;lcd('00:00','#ff3030');sfx.boom();bump=3;setLed(0xff2020,2.5);$('wait').style.display='none';setTimeout(()=>{$('lose').style.display='flex'},700)}
$('go').onclick=begin;$('cont').onclick=release;$('a1').onclick=init;$('a2').onclick=init;
addEventListener('keydown',e=>{if(e.key==='Enter')release();if(e.key.toLowerCase()==='n'){const m=$('master');if(m.style.display==='block'){m.style.display='none'}else{m.innerHTML='<b>Mestre — ordem correta:</b><br>'+ORDEM.map((c,i)=>(i+1)+'. '+c).join('&nbsp;&nbsp; ');m.style.display='block'}}});
// ================= INTERAÇÃO =================
const ray=new T.Raycaster(),mp=new T.Vector2();let hov=-1;
function pick(e){mp.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1);ray.setFromCamera(mp,cam);mod.updateMatrixWorld(true);const h=ray.intersectObjects(pads.map(p=>p.g),true).find(k=>k.object.userData.pad!==undefined);return h?h.object.userData.pad:-1}
R.domElement.addEventListener('pointermove',e=>{mx=e.clientX/innerWidth*2-1;my=e.clientY/innerHeight*2-1;hov=pick(e);R.domElement.style.cursor=(running&&!locked&&hov>=0&&!pads[hov].down)?'pointer':'default'});
R.domElement.addEventListener('pointerdown',e=>{ac();const i=pick(e);if(i>=0)press(i)});
// ================= LOOP =================
let bump=0,last=performance.now();
function frame(now){requestAnimationFrame(frame);const dt=Math.min(.05,(now-last)/1000);last=now;
 if(running&&!over&&!locked){const rem=TEMPO-(now-t0)/1000,s=Math.ceil(rem);if(s!==lastSec){lastSec=s;lcd(lcdTime(rem),rem<60?'#ff5a1a':'#ff3030');if(AC)sfx.tick(rem<60)}if(rem<=0)lose()}
 pads.forEach((p,k)=>{if(p.resetAt&&now>=p.resetAt){p.resetAt=0;p.tz=REST;p.tl=0}
  const h=(hov===k&&running&&!locked&&!p.down)?.05:0,tgt=p.tz+h;p.v+=((tgt-p.z)*420-p.v*24)*dt;p.z+=p.v*dt;p.g.position.z=p.z;
  p.lit+=(p.tl-p.lit)*Math.min(1,dt*9);p.red+=((wrongPad===p&&locked?1:0)-p.red)*Math.min(1,dt*8);
  const L=p.lit;p.bm.emissive.setRGB(p.red*.9,L*.55,L*.2*(1-p.red));p.lm.color.setRGB(.75+L*.1-p.red*.1,.75+L*.25-p.red*.5,.75+L*.1-p.red*.5);p.gm.opacity=L*.8*(.9+.1*Math.sin(now*.006+k));p.gm.color.setHex(p.red>.3?0xff3030:0x38ff6e);if(p.red>.3)p.gm.opacity=p.red*.8;p.L.intensity=Math.max(L*1.3,p.red*1.3);p.L.color.setHex(p.red>.3?0xff3030:0x30ff60)});
 cx+=(mx*1.4-cx)*Math.min(1,dt*3);cy+=(-my*.7-cy)*Math.min(1,dt*3);bump*=Math.pow(.02,dt);
 const d=cam.userData.d;cam.position.set(cx+(Math.random()-.5)*bump*.35,2.2+cy+(Math.random()-.5)*bump*.35,d);cam.lookAt(0,-.2,0);
 R.render(scene,cam)}
init();requestAnimationFrame(frame);
</script></body></html>
